# THE IDENTITY OF THE APP, AND ITS DISTRIBUTION (MIN-292).
#
# This file is the only place where minddy is called "minddy" in the eyes of
#macOS. Nothing he asks is corrected upon execution: the name under the icon,
# that of the menu bar, the icon itself, the signature identifier and the
# schema `minddy://` are read from the `Info.plist` of the bundle, once, at
# launch. As long as we launched from the repository, macOS read the one
# of `Electron.app` — hence “Electron” everywhere, and a `minddy://` which only reached
# anyone (LaunchServices registered Electron.app, not us).
#
# `app.setName("minddy")` (MIN-291) does NOT duplicate: he names it
# data folder (`~/Library/Application Support/minddy/`, where the
# worktrees of the local agent), and it had to be set before there were
# facilities. This names the bundle. Both say the same word, for two
# different reasons.

appId: app.minddy.desktop
productName: minddy
copyright: © 2026 mangue

directories:
  buildResources: build
  output: release

# Negations only: the electron-builder default already embeds `dist/`,
# `package.json` and PRODUCTION dependencies (`electron-updater` and npm
# of bootstrap of the local agent, with their transitivities), by pruning the
# devDependencies — including Electron and electron-builder themselves. List `files`
# in positive would require re-enumerating this transitivity by hand and keeping it at
# current.
files:
  # TypeScript sources: `dist/` is the esbuild bundle, it is sufficient.
  - "!src/**"
  - "!tsconfig.json"
  - "!electron-builder.yml"
  - "!release/**"

# It writes `CFBundleURLTypes`, which makes deep-link authentication testable
# for the first time: `app.setAsDefaultProtocolClient`
# just ANNOUNCES a schema that the bundle must already declare.
protocols:
  - name: minddy
    schemes:
      - minddy

# Windows is distributed exclusively through Microsoft Store. The AppX target
# produces the MSIX payload submitted to Partner Center; Microsoft signs and
# updates that package. There is deliberately no direct installer or Windows
# electron-updater feed.
win:
  target:
    - target: appx
      arch: [x64, arm64]
  executableName: minddy
  # Windows presents the executable icon as a square. This asset has an opaque
  # square background so transparent rounded corners cannot render as black.
  icon: build/icon-windows.png

# Partner Center assigns this immutable identity. Keep the literal values here:
# electron-builder validates AppX identity fields before expanding environment
# placeholders. build-windows-store.mjs still requires the matching GitHub
# variables as a release-time consistency guard. `electronUpdaterAware: false`
# also keeps update metadata out of Store artifacts at packaging time.
appx:
  artifactName: minddy-${version}-windows-${arch}-store.${ext}
  identityName: mangue-dev.minddy
  publisher: CN=D5052B10-735B-4EF0-920F-642DFBDEB04F
  publisherDisplayName: mangue-dev
  applicationId: minddy
  displayName: minddy
  languages: [en-US, fr-FR]
  minVersion: "10.0.17763.0"
  maxVersionTested: "10.0.26100.0"
  electronUpdaterAware: false
  publish: null
  capabilities:
    - runFullTrust

# Linux is distributed first as a portable AppImage. Native DEB and RPM builds
# are published alongside it for administrators who require distro packages.
# `syncDesktopName` and `desktopName` in package.json keep the launcher name,
# Electron WM_CLASS and StartupWMClass identical, so GNOME and KDE associate a
# running minddy window with its icon. electron-builder derives
# `x-scheme-handler/minddy` from the shared `protocols` block above.
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
  category: Office
  executableName: minddy
  syncDesktopName: true
  icon: build/icon-iOS-Default-1024x1024@1x.png
  maintainer: mangue <hello@minddy.app>
  vendor: mangue
  synopsis: A desktop window for minddy
  description: minddy is an issue tracker for product teams and coding agents.
  desktop:
    entry:
      Keywords: issues;projects;productivity;agents;

# electron-builder's default package metadata omits ALSA even though Electron
# links against libasound directly. Keep the upstream defaults explicit and add
# the missing runtime library so a clean package installation can start.
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2

rpm:
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - (libXtst or libXtst6)
    - xdg-utils
    - at-spi2-core
    - (libuuid or libuuid1)
    - alsa-lib

mac:
  category: public.app-category.productivity
  # THE SOURCE IS THE `.icon`, NOT A `.icns`.
  #
  # `build/icon.icon` is the folder rendered by Icon Composer (`icon.json` + the
  # SVG of the logo): the vector, the layers, the glass, and the dark variations
  # and tinted. Since macOS 26 a bundle carries TWO icons, and they do not
  # do not replace — `Assets.car` + `CFBundleIconName` for 26 and beyond,
  # `icon.icns` + `CFBundleIconFile` for all of the above (here until
  # Big Sur, cf. `minimumSystemVersion`). To remove the second is to leave without
  # icon all those who have not yet migrated.
  #
  # electron-builder 26 installs both from this single line
# (`macPackager.applyCommonInfo` → `util/macosIconComposer`): it calls
  # `actool` on the `.icon`, writes the `Assets.car`, sets the key, AND drifts
  # the `icns` compatibility of the same output. Hence the disappearance of
  # `scripts/build-desktop-icon.mjs` and the `icns` commit, which manufactured
  # hand — from a 512 square PNG, without squircle or margins — some
  # something that wasn't in the shape of a macOS icon.
  #
  # **The build therefore requires Xcode 26 or more**: `actool` in version < 26 done
  # fail crafting, with an explicit message. This was already the case for
  # notarization for the machine (macOS), it is now for the tools.
  #
  # A reservation to be aware of: the `icns` that `actool` renders stops at 256 px. On
  # macOS 11→15, a Finder view in large icons therefore enlarges by 256. This is the
  # price of the official channel, and it is better than a very clear icon of
# the wrong shape.
  icon: build/icon.icon
  # Electron 43 no longer starts below (and Big Sur is the first version that
  # runs on Apple Silicon).
  minimumSystemVersion: "11.0"
  darkModeSupport: true
  # The `.dmg` is used for the FIRST download, the `.zip` for updates:
  # Squirrel.Mac can only read the second one. Publishing one without the other gives
  # app that installs and never updates, without saying anything.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # THE PHRASE THAT MACOS DISPLAYS WHEN ASKING FOR THE MICROPHONE (MIN-294).
  #
  # Without it, no request window — and no warning either: the
  # system refuses, the app knows nothing about it. The bundle nevertheless INHERITS one,
  # of Electron.app, but it is its English template (“This app needs access to
  # the microphone"): it says neither who is asking nor for what to do, and that is the
  # only sentence that the person will read before deciding.
  #
  # The French version is in `build/fr.lproj/InfoPlist.strings`, posted by
  # `extraResources` just below. This remains the basis, served to all
# others.
  #
  # FILES PROTECTED BY TCC (MIN-359, decision D4).
  #
  # `~/Documents`, `~/Desktop` and `~/Downloads` are COMMON locations
  # for a deposit, and an external volume is for those who lack space. Without these
  # sentences, macOS refuses to read **and the request window does not even open
# at all**: the refusal is silent, exactly like that of the microphone before MIN-294.
  # This is a failure that only occurs after packaging, at the user's premises, without
  # log — the worst place to find it.
  #
  # ⚠ **These keys change the repost fingerprint** (scripts/desktop-fingerprint.mjs,
# `PACKAGING_INPUTS`), so republication + re-notarization. The objection does not hold
# for this batch: MIN-359 already touches `desktop/src/main.ts` and `preload.ts`,
  # so the print moves anyway. Adding them here is free; THE
  # adding later would cost a second post.
  #
  # **What remains to be measured, and which does not change the decision:** a selection
  # by `dialog.showOpenDialog` constitutes explicit consent and MAY be sufficient to
  # open the path without prompting. Not verified — MIN-359 probe failed
  # (see the ticket comment). Even if it is enough, these sentences remain the
  # net of the case where it is NOT enough, and the case where it is not enough is silent.
  # The question that matters more — does the law reach down to the shells of
  # model, bundle grandchildren? — belongs to the launcher (MIN-293).
  #
  # `NSNetworkVolumesUsageDescription` is there although there is no document
  # request: a repository on a network share is rare, but it would fail in the
  # same silence, and the line costs a sentence.
  extendInfo:
    NSMicrophoneUsageDescription: >-
      minddy uses your microphone to turn what you say into text — dictating an
      issue, a note or a message to Numo. Nothing is recorded unless you start a
      dictation yourself.
    NSDocumentsFolderUsageDescription: >-
      minddy needs this to open the project folder you attached, when you ask an
      agent to work on this Mac rather than in the cloud.
    NSDesktopFolderUsageDescription: >-
      minddy needs this to open the project folder you attached, when you ask an
      agent to work on this Mac rather than in the cloud.
    NSDownloadsFolderUsageDescription: >-
      minddy needs this to open the project folder you attached, when you ask an
      agent to work on this Mac rather than in the cloud.
    NSRemovableVolumesUsageDescription: >-
      minddy needs this to open a project folder you attached on an external
      disk, when you ask an agent to work on this Mac rather than in the cloud.
    NSNetworkVolumesUsageDescription: >-
      minddy needs this to open a project folder you attached on a network
      share, when you ask an agent to work on this Mac rather than in the cloud.
  # Electron's `.lproj` are EMPTY folders: they are only used to
  # declare the bundle languages. Depositing a `InfoPlist.strings` there is
  # translate the sentence above for those who have set their Mac to French — the only one
# only other language that minddy supports.
  extraResources:
    - from: build/fr.lproj/InfoPlist.strings
      to: fr.lproj/InfoPlist.strings
  # Hardened runtime: Apple refuses to notarize without. The entitlements which
# accompanying it are in build/entitlements.mac.plist, with the reason for
# each one.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # `gatekeeperAssess` passes `spctl` DURING the build, before notarization —
  # so it always fails at that point, and for nothing. The real check
  # is `spctl -a -vvv` on the stapled `.dmg` (see docs/desktop-release.md).
  gatekeeperAssess: false
  # Notarization by `notarytool`, then stapling the ticket. **A boolean, and nothing
  # else**: the object form (`notarize: {teamId: …}`) is refused by
  # electron-builder 26, which renders a schematic error.
  #
  # Identifiers are read in the ENVIRONMENT, never here. Three families,
  # tried in this order (app-builder-lib, `MacTargetHelper.getNotarizeOptions`):
  # APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID, then the API key
# App Store Connect, then **APPLE_KEYCHAIN_PROFILE** — the one we use,
  # because it is the only one where the password does not leave the keychain
  # (`xcrun notarytool store-credentials "minddy-notary"`).
  #
  # ⚠ **The absence of identifiers does NOT cause the build to fail**: electron-builder
  # writes `skipped macOS notarization` to `warn` in the middle of a hundred lines, and returns
  # a signed but NOT notarized app — which Gatekeeper will refuse from people.
  # This is why `scripts/publish-desktop.mjs` checks the stapled ticket before
  # to publish: this silence must not cross the door.
  notarize: true

dmg:
  # The `.dmg` window: the app on the left, the link to /Applications on the right.
  # It's the gesture that everyone knows, and it cannot be reinvented.
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications

# The update feed. `generic` and not `github`: the deposit is private, and the
# provider GitHub would require embedding a token in a distributed app.
# electron-builder copies this block into `app-update.yml` INSIDE the bundle,
# and this is the file that electron-updater reads — hence the fact that the URL is
# here and nowhere in the code.
publish:
  provider: generic
  url: ${env.MINDDY_DESKTOP_FEED_URL}
  channel: latest
