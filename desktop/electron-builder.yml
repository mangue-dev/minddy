# L'IDENTITÉ DE L'APP, ET SA DISTRIBUTION (MIN-292).
#
# Ce fichier est le seul endroit où minddy s'appelle « minddy » aux yeux de
# macOS. Rien de ce qu'il pose ne se corrige à l'exécution : le nom sous l'icône,
# celui de la barre de menus, l'icône elle-même, l'identifiant de signature et le
# schéma `minddy://` sont lus dans l'`Info.plist` du bundle, une fois, au
# lancement. Tant qu'on lançait depuis le dépôt, macOS lisait celui
# d'`Electron.app` — d'où « Electron » partout, et un `minddy://` qui n'atteignait
# personne (LaunchServices inscrivait Electron.app, pas nous).
#
# `app.setName("minddy")` (MIN-291) ne fait PAS double emploi : lui nomme le
# dossier de données (`~/Library/Application Support/minddy/`, où vivront les
# worktrees de l'agent local), et il devait être posé avant qu'il existe des
# installations. Celui-ci nomme le bundle. Les deux disent le même mot, pour deux
# raisons différentes.

appId: app.minddy.desktop
productName: minddy
copyright: © 2026 mangue

directories:
  buildResources: build
  output: release

# Négations seulement : le défaut d'electron-builder embarque déjà `dist/`,
# `package.json` et les dépendances de PRODUCTION (`electron-updater` et le npm
# de bootstrap de l'agent local, avec leurs transitivités), en élaguant les
# devDependencies — dont Electron et electron-builder eux-mêmes. Lister `files`
# en positif obligerait à réénumérer cette transitivité à la main et à la tenir à
# jour.
files:
  # Les sources TypeScript : `dist/` est le bundle esbuild, il se suffit.
  - "!src/**"
  - "!tsconfig.json"
  - "!electron-builder.yml"

# C'est LUI qui écrit `CFBundleURLTypes`, et c'est ce qui rend le deep link
# d'authentification testable pour la première fois : `app.setAsDefaultProtocolClient`
# ne fait qu'ANNONCER un schéma que le bundle doit déjà déclarer.
protocols:
  - name: minddy
    schemes:
      - minddy

mac:
  category: public.app-category.productivity
  # LA SOURCE EST LE `.icon`, PAS UN `.icns`.
  #
  # `build/icon.icon` est le dossier rendu par Icon Composer (`icon.json` + le
  # SVG du logo) : le vecteur, les couches, le verre, et les déclinaisons sombre
  # et teintée. Depuis macOS 26 un bundle porte DEUX icônes, et elles ne se
  # remplacent pas — `Assets.car` + `CFBundleIconName` pour 26 et au-delà,
  # `icon.icns` + `CFBundleIconFile` pour tout ce qui précède (ici jusqu'à
  # Big Sur, cf. `minimumSystemVersion`). Retirer la seconde, c'est laisser sans
  # icône tous ceux qui n'ont pas encore migré.
  #
  # electron-builder 26 pose les deux à partir de cette seule ligne
  # (`macPackager.applyCommonInfo` → `util/macosIconComposer`) : il appelle
  # `actool` sur le `.icon`, écrit l'`Assets.car`, pose la clé, ET dérive
  # l'`icns` de compatibilité de la même sortie. D'où la disparition de
  # `scripts/build-desktop-icon.mjs` et de l'`icns` commité, qui fabriquaient à
  # la main — depuis un PNG carré de 512, sans squircle ni marges — quelque
  # chose qui n'avait pas la forme d'une icône macOS.
  #
  # **Le build exige donc Xcode 26 ou plus** : `actool` en version < 26 fait
  # échouer la fabrication, avec un message explicite. C'était déjà le cas de la
  # notarisation pour la machine (macOS), ça l'est maintenant pour l'outillage.
  #
  # Une réserve à connaître : l'`icns` que rend `actool` s'arrête à 256 px. Sur
  # macOS 11→15, une vue Finder en grandes icônes agrandit donc du 256. C'est le
  # prix de la chaîne officielle, et il vaut mieux qu'une icône bien nette de
  # mauvaise forme.
  icon: build/icon.icon
  # Electron 43 ne démarre plus en deçà (et Big Sur est la première version qui
  # tourne sur Apple Silicon).
  minimumSystemVersion: "11.0"
  darkModeSupport: true
  # Le `.dmg` sert au PREMIER téléchargement, le `.zip` aux mises à jour :
  # Squirrel.Mac ne sait lire que le second. Publier l'un sans l'autre donne une
  # app qui s'installe et ne se met jamais à jour, sans rien dire.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # LA PHRASE QUE MACOS AFFICHE EN DEMANDANT LE MICRO (MIN-294).
  #
  # Sans elle, pas de fenêtre de demande — et pas d'avertissement non plus : le
  # système refuse, l'app n'en sait rien. Le bundle en HÉRITE pourtant une,
  # d'Electron.app, mais c'est son gabarit anglais (« This app needs access to
  # the microphone ») : il ne dit ni qui demande ni pour quoi faire, et c'est la
  # seule phrase que la personne lira avant de décider.
  #
  # La version française est dans `build/fr.lproj/InfoPlist.strings`, posée par
  # `extraResources` juste en dessous. Celle-ci reste la base, servie à tous les
  # autres.
  #
  # LES DOSSIERS PROTÉGÉS PAR TCC (MIN-359, décision D4).
  #
  # `~/Documents`, `~/Desktop` et `~/Downloads` sont des emplacements COURANTS
  # pour un dépôt, et un volume externe l'est pour qui manque de place. Sans ces
  # phrases, macOS refuse la lecture **et la fenêtre de demande ne s'ouvre même
  # pas** : le refus est muet, exactement comme celui du micro avant MIN-294.
  # C'est une panne qui n'arrive qu'après empaquetage, chez l'utilisateur, sans
  # log — le pire endroit pour la découvrir.
  #
  # ⚠ **Ces clés changent l'empreinte de republication** (scripts/desktop-fingerprint.mjs,
  # `PACKAGING_INPUTS`), donc republication + renotarisation. L'objection ne tient
  # pas pour ce lot : MIN-359 touche déjà `desktop/src/main.ts` et `preload.ts`,
  # donc l'empreinte bouge de toute façon. Les ajouter ici est gratuit ; les
  # ajouter plus tard coûterait une seconde publication.
  #
  # **Ce qui reste à mesurer, et qui ne change pas la décision :** une sélection
  # par `dialog.showOpenDialog` vaut consentement explicite et POURRAIT suffire à
  # ouvrir le chemin sans invite. Non vérifié — la sonde de MIN-359 n'a pas abouti
  # (cf. le commentaire du ticket). Même si elle suffit, ces phrases restent le
  # filet du cas où elle ne suffit PAS, et le cas où elle ne suffit pas est muet.
  # La question qui compte davantage — le droit descend-il jusqu'aux shells du
  # modèle, petits-enfants du bundle ? — appartient au lanceur (MIN-293).
  #
  # `NSNetworkVolumesUsageDescription` est là bien qu'aucun document ne la
  # demande : un dépôt sur un partage réseau est rare, mais il échouerait dans le
  # même silence, et la ligne coûte une phrase.
  extendInfo:
    NSMicrophoneUsageDescription: >-
      minddy uses your microphone to turn what you say into text — dictating an
      issue, a note or a message to Numo. Nothing is recorded unless you start a
      dictation yourself.
    NSDocumentsFolderUsageDescription: >-
      minddy needs this to open the project folder you attached, when you ask an
      agent to work on this Mac rather than in the cloud.
    NSDesktopFolderUsageDescription: >-
      minddy needs this to open the project folder you attached, when you ask an
      agent to work on this Mac rather than in the cloud.
    NSDownloadsFolderUsageDescription: >-
      minddy needs this to open the project folder you attached, when you ask an
      agent to work on this Mac rather than in the cloud.
    NSRemovableVolumesUsageDescription: >-
      minddy needs this to open a project folder you attached on an external
      disk, when you ask an agent to work on this Mac rather than in the cloud.
    NSNetworkVolumesUsageDescription: >-
      minddy needs this to open a project folder you attached on a network
      share, when you ask an agent to work on this Mac rather than in the cloud.
  # Les `.lproj` d'Electron sont des dossiers VIDES : ils ne servent qu'à
  # déclarer les langues du bundle. Y déposer un `InfoPlist.strings`, c'est
  # traduire la phrase ci-dessus pour qui a réglé son Mac en français — la seule
  # autre langue que minddy parle.
  extraResources:
    - from: build/fr.lproj/InfoPlist.strings
      to: fr.lproj/InfoPlist.strings
  # Hardened runtime : Apple refuse de notariser sans. Les entitlements qui
  # l'accompagnent sont dans build/entitlements.mac.plist, avec la raison de
  # chacun.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # `gatekeeperAssess` fait passer `spctl` PENDANT le build, avant notarisation —
  # il échoue donc toujours à ce moment-là, et pour rien. La vraie vérification
  # est `spctl -a -vvv` sur le `.dmg` agrafé (procédure interne de signature).
  gatekeeperAssess: false
  # Notarisation par `notarytool`, puis agrafage du ticket. **Un booléen, et rien
  # d'autre** : la forme objet (`notarize: {teamId: …}`) est refusée par
  # electron-builder 26, qui rend une erreur de schéma.
  #
  # Les identifiants se lisent dans l'ENVIRONNEMENT, jamais ici. Trois familles,
  # essayées dans cet ordre (app-builder-lib, `MacTargetHelper.getNotarizeOptions`) :
  # APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID, puis la clé d'API
  # App Store Connect, puis **APPLE_KEYCHAIN_PROFILE** — celle qu'on utilise,
  # parce qu'elle est la seule où le mot de passe ne quitte pas le trousseau
  # (`xcrun notarytool store-credentials "minddy-notary"`).
  #
  # ⚠ **L'absence d'identifiants ne fait PAS échouer le build** : electron-builder
  # écrit `skipped macOS notarization` en `warn` au milieu de cent lignes, et rend
  # une app signée mais NON notarisée — que Gatekeeper refusera chez les gens.
  # C'est pour ça que `scripts/publish-desktop.mjs` vérifie le ticket agrafé avant
  # de publier : ce silence-là ne doit pas franchir la porte.
  notarize: true

dmg:
  # La fenêtre du `.dmg` : l'app à gauche, le lien vers /Applications à droite.
  # C'est le geste que tout le monde connaît, et il ne se réinvente pas.
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications

# Le flux de mise à jour. `generic` et non `github` : le dépôt est privé, et le
# provider GitHub obligerait à embarquer un token dans une app distribuée.
# electron-builder recopie ce bloc dans `app-update.yml` À L'INTÉRIEUR du bundle,
# et c'est ce fichier-là que lit electron-updater — d'où le fait que l'URL soit
# ici et nulle part dans le code.
publish:
  provider: generic
  url: ${env.MINDDY_DESKTOP_FEED_URL}
  channel: latest
