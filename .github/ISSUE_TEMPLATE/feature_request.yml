name: Suggest an improvement
description: Describe a need or an evolution of the open source core
title: "[Improvement]""
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem to solve. An exploratory discussion can be opened in [GitHub Discussions](https://github.com/mangue-dev/minddy-issues/discussions).

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prior checks
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This proposal concerns the open-source core or its public interface, not a private support request.
          required: true
        - label: I agree to follow the project's Code of Conduct.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who encounters this problem, in what context, and with what impact?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Desired result
      description: Describe the expected behavior without unnecessarily imposing an implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Current workarounds, solutions compared or reasons to rule them out.

  - type: textarea
    id: scope
    attributes:
      label: Scope and compatibility
      description: API, migration, data, security, accessibility or possible compatibility break.

  - type: dropdown
    id: contribution
    attributes:
      label: Would you like to contribute to the implementation?
      options:
        - Oui
        - Maybe, with guidance
        - Non
    validations:
      required: true
