name: Report a bug
description: Report a reproducible minddy issue
title: "[Bug] "
labels:
  - bug
  - needs reproduction
body:
  - type: markdown
    attributes:
      value: |
        Please check existing issues before continuing. For a vulnerability, do not use this form: follow the [security policy](https://github.com/mangue-dev/minddy-issues/security/policy).

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prior checks
      options:
        - label: I searched for an existing issue describing the same problem.
          required: true
        - label: This report contains no secret, personal data, or details of an unpatched vulnerability.
          required: true
        - label: I agree to follow the project's Code of Conduct.
          required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Tag, version number or SHA of the commit used.
      placeholder: v0.9.5 or abc1234
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Usage mode
      options:
        - Self-hosted
        - Minddy Cloud
        - Local development
        - Application macOS
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environnement
      description: Browser and version, system, Node.js version, host and database if relevant.
      placeholder: macOS 15, Chrome 140, Node.js 24, Supabase hosted
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what is the concrete impact?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction steps
      placeholder: |
        1. Create…
        2. Ouvrir…
        3. Observer…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Result obtained
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or captures
      description: Remove tokens, emails, project IDs and customer data. Files can be dropped here.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Known regression, frequency, workaround, or other useful information.
