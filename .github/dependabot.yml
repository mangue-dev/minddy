version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    ignore:
      # jsdom 27+ requires ESM-only packages, and Vercel functions run with
      # --no-experimental-require-module, so page tools fail only in
      # production. See lib/server/pages-projection.ts before lifting this.
      - dependency-name: jsdom
        versions: [">=27"]
      # Pinned to the exact version the Radix primitives depend on, so the app
      # ships one copy. Bump it together with those primitives, not alone.
      - dependency-name: "@radix-ui/react-slot"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: deps-desktop
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: ci
