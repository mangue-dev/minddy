name: Public core release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer already prepared in package.json (without v prefix)"
        required: true
        type: string
      sha:
        description: "Exact production SHA to tag"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

concurrency:
  group: production-publication
  cancel-in-progress: false

jobs:
  release:
    name: Verify, tag and publish v${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: public-release
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git fetch origin production --tags
          node scripts/release-policy.mjs "$RELEASE_SHA"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          test "$(node -p "require('./desktop/package.json').version")" = "$RELEASE_VERSION"
          test -z "$(git tag --list "v$RELEASE_VERSION")"
          node -e "import('./scripts/release-lib.mjs').then(({ assertVersion }) => assertVersion(process.env.RELEASE_VERSION))"

      # This barrier deliberately precedes the installation: the code of a
      # dependency or a script in the repository has not executed anything yet.
      - name: Public repository check
        run: node scripts/check-public-repo.mjs

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: node scripts/build-desktop.mjs
      - run: pnpm run test
      - run: pnpm run test:release
      - run: node scripts/audit.mjs

      # The build is redone without .env or secrets. Neutral public values
      # allow Next to produce the same surface as on an instance,
      # without contacting an external service.
      - name: Reproducible web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: release-build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: release-build-placeholder
          NEXT_PUBLIC_APP_URL: https://minddy.invalid
        run: pnpm run build

      - name: Build release artifacts
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: pnpm run release:artifacts

      - name: Define official image name
        id: image
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha }}
        run: |
          IFS=. read -r major minor patch <<< "$VERSION"
          {
            echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/minddy"
            echo "candidate_tag=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/minddy:candidate-$SHA"
            echo "release_tag=v$VERSION"
            echo "minor_tag=v$major.$minor"
            echo "major_tag=v$major"
            echo "tags<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/minddy:v$VERSION"
            if [[ "$VERSION" != *-* ]]; then
              echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/minddy:v$major.$minor"
              echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/minddy:v$major"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Publishing the same release tag twice would make an apparently pinned
      # operator reference mutable. The preflight keeps the workflow itself
      # append-only even if a registry setting is accidentally loosened.
      - name: Reject an existing OCI release tag
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:v$VERSION" >/dev/null 2>&1; then
            echo "::error::OCI tag $IMAGE:v$VERSION already exists and must not be overwritten."
            exit 1
          fi

      - name: Publish signed-release candidate image
        id: container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.candidate_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          provenance: mode=max
          sbom: true

      - name: Enforce fixed high and critical vulnerability threshold
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.container.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln

      - name: Attest OCI image provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.container.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@v3

      - name: Keylessly sign the OCI manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.container.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Promote official OCI tags
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.container.outputs.digest }}
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              docker buildx imagetools create --tag "$tag" "$IMAGE@$DIGEST"
            fi
          done <<< "$TAGS"

      - name: Add immutable container identity to release assets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.container.outputs.digest }}
        run: pnpm run release:container-artifact -- "$IMAGE" "$DIGEST"

      - name: Attest release artifacts
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: .release/*

      - name: Document unavailable GitHub attestation
        if: github.event.repository.visibility != 'public'
        run: >-
          echo '::notice::GitHub artifact attestations are unavailable for a
          user-owned private repository; verify the published SHA256SUMS and
          the keyless OCI signature until the repository is public.'

      #The tag only exists after all checks and builds. A failure
      #before this step therefore leaves production intact and can be replayed.
      - name: Create annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git fetch origin production --tags
          node scripts/release-policy.mjs "$RELEASE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$RELEASE_VERSION" -m "minddy v$RELEASE_VERSION" "${{ inputs.sha }}"
          git push origin "v$RELEASE_VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          gh release create "v$RELEASE_VERSION"
          .release/minddy-v$RELEASE_VERSION-source.tar.gz
          .release/minddy-v$RELEASE_VERSION-migrations.tar.gz
          .release/release-manifest.json
          .release/RELEASE_NOTES.md
          .release/UPDATE.md
          .release/minddy-v${{ inputs.version }}-container.txt
          .release/SHA256SUMS
          --verify-tag
          --title "minddy v$RELEASE_VERSION"
          --notes-file .release/RELEASE_NOTES.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-release-${{ inputs.version }}
          path: .release/
          if-no-files-found: ignore
          retention-days: 30
