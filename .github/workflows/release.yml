name: Public core release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer déjà préparée dans package.json et CHANGELOG.md (sans préfixe v)"
        required: true
        type: string
      sha:
        description: "SHA exact de production à taguer"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: production-publication
  cancel-in-progress: false

jobs:
  release:
    name: Verify, tag and publish v${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: public-release
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release request
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          git fetch origin production --tags
          node scripts/release-policy.mjs "$RELEASE_SHA"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          test "$(node -p "require('./desktop/package.json').version")" = "$RELEASE_VERSION"
          test -z "$(git tag --list "v$RELEASE_VERSION")"
          node -e "import('./scripts/release-lib.mjs').then(({ assertVersion, changelogSection }) => { const fs = require('node:fs'); assertVersion(process.env.RELEASE_VERSION); changelogSection(fs.readFileSync('CHANGELOG.md', 'utf8'), process.env.RELEASE_VERSION); })"

      # Cette barrière précède volontairement l'installation : le code d'une
      # dépendance ou d'un script du dépôt n'a encore rien exécuté.
      - name: Public repository check
        run: node scripts/check-public-repo.mjs

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: node scripts/build-desktop.mjs
      - run: pnpm run test
      - run: pnpm run test:release
      - run: node scripts/audit.mjs

      # Le build est refait sans .env ni secret. Les valeurs publiques neutres
      # permettent à Next de produire la même surface que sur une instance,
      # sans joindre un service externe.
      - name: Reproducible web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: release-build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: release-build-placeholder
          NEXT_PUBLIC_APP_URL: https://minddy.invalid
        run: pnpm run build

      - name: Build release artifacts
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: pnpm run release:artifacts

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: .release/*

      # Le tag n'existe qu'après tous les contrôles et tous les builds. Un échec
      # avant cette étape laisse donc production intact et peut être rejoué.
      - name: Create annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          git fetch origin production --tags
          node scripts/release-policy.mjs "$RELEASE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$RELEASE_VERSION" -m "minddy v$RELEASE_VERSION" "${{ inputs.sha }}"
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push origin "v$RELEASE_VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          gh release create "v$RELEASE_VERSION"
          .release/minddy-v$RELEASE_VERSION-source.tar.gz
          .release/minddy-v$RELEASE_VERSION-migrations.tar.gz
          .release/release-manifest.json
          .release/RELEASE_NOTES.md
          .release/UPDATE.md
          .release/SHA256SUMS
          --verify-tag
          --title "minddy v$RELEASE_VERSION"
          --notes-file .release/RELEASE_NOTES.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-release-${{ inputs.version }}
          path: .release/
          if-no-files-found: ignore
          retention-days: 30
