name: CI

# This workflow is the reference versioned pipeline. Testing, auditing and typechecking
# run on a disposable runner that sees no production secrets.
#
# Here, the same code runs in a disposable runner that sees NO secrets:
#
# - `pull_request` (and not `pull_request_target`): the job executes with the
# `GITHUB_TOKEN` read-only of a fork, without access to repository secrets.
# `pull_request_target` would run in the context of the base repository
# WITH its secrets, by checking out the contributor's code — it's
# exactly the opposite of what we want. Do not reintroduce it.
# - `permissions: contents: read`: the job token cannot write anything.
# - no `secrets.*` appears in this file, and it should never
# appear. A job that needs a secret is a job that shouldn't
# run on PR code.
#
# Additional GitHub settings side (not versionable): Settings → Actions →
# “Require approval for all external contributors”, so that no fork PR
# do not start a job without human proofreading.

on:
  pull_request:
  push:
    # Promote production already requires a successful CI run for this exact
    # commit on main. Running the same jobs again after the fast-forward would
    # double the bill without testing different bytes.
    branches: [main]
    # Release-record commits also need CI because production promotion requires
    # a successful main push run for the exact commit being deployed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing else. No Supabase key, no token: the rest and the typecheck
  # are pure, and the page projection build (see below) too.
  CI: "true"

# The repository is public, so standard GitHub-hosted runners are not billed:
# wall time, not runner minutes, is what this layout optimizes. Every job below
# starts at once, and the required gate waits for all of them.
jobs:
  # The history scans run beside the Node jobs because they need no
  # dependencies. A push to main scans every reachable object. The `Protect
  # main` ruleset admits changes only through a pull request, with no bypass,
  # so a pull request scans just what it adds on top of main: its merge commit
  # minus the first parent. It therefore skips downloading every historical
  # file (about two minutes), fetching only the blobs its own diffs read. A
  # pull request that changes the scanning rules rescans the whole history,
  # because a new rule must also hold for commits already on main.
  guards:
    name: Publication & secret guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: ${{ github.event_name == 'pull_request' && 'blob:none' || '' }}
          persist-credentials: false

      - name: Enforce immutable workflow and container references
        run: node scripts/check-workflow-action-pins.mjs

      # Tree comparisons and `--raw` diffs read object ids only, so they work
      # before any historical blob is present. From here on, a blob the fetch
      # missed must fail the scan rather than be fetched one by one or skipped.
      - name: Choose and fetch the history scan scope
        id: scope
        shell: bash
        env:
          GIT_NO_LAZY_FETCH: "1"
        run: |
          set -euo pipefail
          blobs="$RUNNER_TEMP/history-blobs"
          since=""
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # A pull request is checked out as its merge commit; its first
            # parent is the current tip of the base branch.
            base="$(git rev-parse --verify 'HEAD^1^{commit}')"
            rules_changed="$(git diff-tree -r --name-only --no-renames "$base" HEAD -- .gitleaks.toml scripts/check-public-repo.mjs)"
            if [ -z "$rules_changed" ]; then since="$base"; fi
          fi
          if [ -n "$since" ]; then
            {
              git rev-list --objects --missing=print HEAD --not "$since" | sed -n 's/^?//p'
              git log --raw -m --no-renames --no-abbrev --format= "$since..HEAD" | awk 'NF { print $3; print $4 }'
            } | { grep -v '^0*$' || true; } | sort -u > "$blobs"
            echo "since=$since" >> "$GITHUB_OUTPUT"
            echo "log_opts=$since..HEAD" >> "$GITHUB_OUTPUT"
          else
            git rev-list --objects --all --missing=print | sed -n 's/^?//p' > "$blobs"
            echo "log_opts=--all" >> "$GITHUB_OUTPUT"
          fi
          if [ -s "$blobs" ]; then
            git -c fetch.negotiationAlgorithm=noop fetch --quiet --no-tags --no-write-fetch-head \
              --filter=blob:none --stdin origin < "$blobs"
          fi
          # Every diff gitleaks will read must now be complete offline.
          if [ -n "$since" ]; then
            git log -p -U0 -m --format= "$since..HEAD" > /dev/null
          fi
          if [ -n "$since" ]; then scope="pull request"; else scope=full; fi
          echo "Fetched $(wc -l < "$blobs") historical blobs for the $scope scan."

      # No internal documents, production identifiers or secrets should be
      # reach the forge, even if a contributor bypasses their .gitignore.
      - name: Public repository check
        env:
          GIT_NO_LAZY_FETCH: "1"
          SINCE: ${{ steps.scope.outputs.since }}
        run: node scripts/check-public-repo.mjs ${SINCE:+--new-since "$SINCE"}

      - name: Scan secrets and publication data markers
        env:
          LOG_OPTS: ${{ steps.scope.outputs.log_opts }}
        run: >-
          docker run --rm
          --env GIT_NO_LAZY_FETCH=1
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          --workdir /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --config /repo/.gitleaks.toml --no-banner --redact=100
          --log-opts="$LOG_OPTS"

  validation:
    name: Lint, typecheck & contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # None of these steps reads Git history; the tooling tests that exercise
      # Git build their own temporary repositories.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm is the manager that ACTUALLY installs this repository (node_modules
      # is a pnpm store); `package-lock.json` is held second for
      # tools that only read one. The CI therefore installs by pnpm, otherwise it
      # would check a tree that no one is running.
      #
      # pnpm 10 does not run dependency build scripts outside of
      # `pnpm.onlyBuiltDependencies` (here: esbuild alone). This is what limits this
      # what a compromised package can do to the installation.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Root regression tests import the shell source, including Electron's
      # types. Keep its independent lockfile installed without downloading or
      # running native binaries on the web validation runner.
      - name: Install desktop test dependencies
        run: npm --prefix desktop ci --ignore-scripts

      # The linter goes first: 2 s, and it catches a class of errors that
      # the typecheck does not see (unsafe optional chaining, dead variable,
      # invalid `fetch` options). `--deny-warnings` makes it a barrier —
      # without it, oxlint outputs 0 and the CI would say nothing.
      - name: Lint
        run: pnpm run lint

      - name: Public documentation contract
        run: |
          pnpm run check:documentation
          pnpm run test:documentation-check
          pnpm run check:knowledge
          pnpm run check:owned-english

      - name: Encrypted column access
        run: |
          pnpm run check:encrypted-access
          pnpm run check:encryption-schema

      - name: Typecheck
        run: |
          pnpm run typecheck
          npm --prefix desktop run typecheck

      # The root tsconfig excludes the Electron shell, which has its own build.
      # The bundle nevertheless resolves all its local imports: it therefore catches a
      # API moved to launcher before releasing a broken binary.
      - name: Desktop bundle
        run: node scripts/build-desktop.mjs

      - name: Tooling tests
        run: pnpm run test:tooling

      - name: Self-hosted minimal egress contract
        env:
          MINDDY_PUBLIC_APP_URL: http://minddy:3000
          MINDDY_PUBLIC_SUPABASE_URL: https://project.supabase.co
          MINDDY_SCHEDULER_URL: http://minddy:3000
        run: pnpm run verify:self-hosted-egress -- --egress-log test/fixtures/self-hosted-egress/minimal.json --profile minimal --report "$RUNNER_TEMP/self-hosted-egress-minimal.md"

      - name: Self-hosted provider egress contract
        env:
          MINDDY_PUBLIC_APP_URL: http://minddy:3000
          MINDDY_PUBLIC_SUPABASE_URL: https://project.supabase.co
          MINDDY_SCHEDULER_URL: http://minddy:3000
          EMAIL_PROVIDER: resend
          RESEND_API_KEY: test-resend-key
          FEEDBACK_EMAIL_FROM: feedback@example.test
          INVITATION_EMAIL_FROM: invitations@example.test
        run: pnpm run verify:self-hosted-egress -- --egress-log test/fixtures/self-hosted-egress/provider.json --profile provider --allow-host api.resend.com --report "$RUNNER_TEMP/self-hosted-egress-provider.md"

      - name: Self-hosted blocked-vendor egress diagnostic
        env:
          MINDDY_PUBLIC_APP_URL: http://minddy:3000
          MINDDY_PUBLIC_SUPABASE_URL: https://project.supabase.co
          MINDDY_SCHEDULER_URL: http://minddy:3000
        shell: bash
        run: |
          set +e
          pnpm run verify:self-hosted-egress -- --egress-log test/fixtures/self-hosted-egress/blocked-vendor.json --profile minimal --report "$RUNNER_TEMP/self-hosted-egress-blocked.md"
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'server → `api.stripe.com`: stripe is not enabled' "$RUNNER_TEMP/self-hosted-egress-blocked.md"
          ! grep -F '/v1/customers' "$RUNNER_TEMP/self-hosted-egress-blocked.md"

      # The seven contract checks take seconds each, so they share this runner
      # rather than repeating checkout and installation per edition.
      # Subshells prevent one fixture's exported values from leaking into the
      # next scenario.
      - name: Check all edition contracts
        shell: bash
        run: |
          for edition in \
            self-hosted-minimal \
            self-hosted-byok \
            minddy-cloud \
            managed-forge \
            partial-billing \
            partial-ai \
            implicit-identifiers
          do
            (
              set -a
              source "test/fixtures/editions/$edition.env"
              set +a
              pnpm exec vitest run lib/server/editions.integration.test.ts
            )
          done

      - name: Upload self-hosted egress reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-hosted-egress-reports
          path: ${{ runner.temp }}/self-hosted-egress-*.md
          if-no-files-found: error
          retention-days: 7

  # Deployable editions must compile and open an HTTP port with the exact
  # fixture the contract step checks. Partial variants remain covered by their
  # contract diagnostics and intentionally cannot start. Each build takes about
  # a minute, so one runner per edition keeps them off the critical path.
  editions:
    name: Build & start (${{ matrix.edition }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        edition: [self-hosted-minimal, minddy-cloud, managed-forge]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build and start the edition
        shell: bash
        env:
          EDITION: ${{ matrix.edition }}
        run: |
          set -a
          source "test/fixtures/editions/$EDITION.env"
          set +a
          pnpm run build
          log_file="$RUNNER_TEMP/minddy-$EDITION-start.log"
          pnpm exec next start -p 3100 > "$log_file" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --show-error --output /dev/null http://127.0.0.1:3100/; then
              exit 0
            fi
            sleep 1
          done
          sed -n '1,240p' "$log_file"
          exit 1

  tests:
    name: Unit tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install desktop test dependencies
        run: npm --prefix desktop ci --ignore-scripts

      # Each shard builds its own projection artifact through globalSetup and
      # retains per-file isolation. Every discovered file runs on one shard.
      # Most of a shard's time is module import and transform rather than test
      # bodies, so more shards shorten the run almost linearly.
      - name: Tests
        run: >-
          pnpm exec vitest run --shard=${{ matrix.shard }}/4
          --reporter=default --reporter=json
          --outputFile="${{ runner.temp }}/vitest-${{ matrix.shard }}.json"

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-${{ matrix.shard }}
          path: ${{ runner.temp }}/vitest-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

  # Preserve the required check name. A failed or cancelled guard, validation,
  # edition or shard job must fail this gate; a skipped dependency must never
  # produce a green PR.
  checks:
    name: Tests & typecheck
    if: always()
    needs: [guards, validation, editions, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all checks to pass
        env:
          GUARDS_RESULT: ${{ needs.guards.result }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
          EDITIONS_RESULT: ${{ needs.editions.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: test "$GUARDS_RESULT" = success && test "$VALIDATION_RESULT" = success && test "$EDITIONS_RESULT" = success && test "$TEST_RESULT" = success

  audit:
    name: Dependencies audit
    runs-on: ubuntu-latest
    # Leave enough time for two bounded retries when the npm audit endpoint is transiently unavailable.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true

      # GitHub evaluates dependency changes against its advisory database, so
      # pull requests remain protected even when the npm audit service is down.
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      # No installation: the audit reads the lockfiles, it does not need
      # the tree. The root pnpm and desktop npm trees are covered. The root
      # package-lock is a compatibility projection, not an installed tree.
      - name: Audit (high+)
        env:
          # Dependency Review protects changed PR dependencies, while enabled
          # Dependabot alerts monitor the complete default-branch graph.
          MINDDY_AUDIT_ALLOW_UNAVAILABLE: "true"
        run: node scripts/audit.mjs
