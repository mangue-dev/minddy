name: CI

# This workflow is the reference versioned pipeline. Testing, auditing and typechecking
# run on a disposable runner that sees no production secrets.
#
# Here, the same code runs in a disposable runner that sees NO secrets:
#
# - `pull_request` (and not `pull_request_target`): the job executes with the
# `GITHUB_TOKEN` read-only of a fork, without access to repository secrets.
# `pull_request_target` would run in the context of the base repository
# WITH its secrets, by checking out the contributor's code — it's
# exactly the opposite of what we want. Do not reintroduce it.
# - `permissions: contents: read`: the job token cannot write anything.
# - no `secrets.*` appears in this file, and it should never
# appear. A job that needs a secret is a job that shouldn't
# run on PR code.
#
# Additional GitHub settings side (not versionable): Settings → Actions →
# “Require approval for all external contributors”, so that no fork PR
# do not start a job without human proofreading.

on:
  pull_request:
  push:
    # Promote production already requires a successful CI run for this exact
    # commit on main. Running the same jobs again after the fast-forward would
    # double the bill without testing different bytes.
    branches: [main]
    # The desktop release workflow generates this metadata only after all
    # native packages have passed their protected publication jobs.
    paths-ignore:
      - desktop/released.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing else. No Supabase key, no token: the rest and the typecheck
  # are pure, and the page projection build (see below) too.
  CI: "true"

jobs:
  checks:
    name: Tests & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce immutable workflow and container references
        run: node scripts/check-workflow-action-pins.mjs

      # No internal documents, production identifiers or secrets should be
      # reach the forge, even if a contributor bypasses their .gitignore.
      - name: Public repository check
        run: node scripts/check-public-repo.mjs

      - name: Scan secrets and publication data markers
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          --workdir /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --config /repo/.gitleaks.toml --no-banner --redact=100
          --log-opts="--all"

      # pnpm is the manager that ACTUALLY installs this repository (node_modules
      # is a pnpm store); `package-lock.json` is held second for
      # tools that only read one. The CI therefore installs by pnpm, otherwise it
      # would check a tree that no one is running.
      #
      # pnpm 10 does not run dependency build scripts outside of
      # `pnpm.onlyBuiltDependencies` (here: esbuild alone). This is what limits this
      # what a compromised package can do to the installation.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.28.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The linter goes first: 2 s, and it catches a class of errors that
      # the typecheck does not see (unsafe optional chaining, dead variable,
      # invalid `fetch` options). `--deny-warnings` makes it a barrier —
      # without it, oxlint outputs 0 and the CI would say nothing.
      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # The root tsconfig excludes the Electron shell, which has its own build.
      # The bundle nevertheless resolves all its local imports: it therefore catches a
      # API moved to launcher before releasing a broken binary.
      - name: Desktop bundle
        run: node scripts/build-desktop.mjs

      # `vitest` first builds the page projection bundle
      # (test/build-pages-md-setup.ts): this is code from the repository executed before the
      # first test, and that's precisely why it has to run here.
      - name: Tests
        run: pnpm run test

      - name: Release tooling tests
        run: pnpm run test:release

      - name: Self-hosted egress policy tests
        run: pnpm run test:self-hosted

      - name: Self-hosted minimal egress contract
        env:
          MINDDY_PUBLIC_APP_URL: http://minddy:3000
          MINDDY_PUBLIC_SUPABASE_URL: https://project.supabase.co
          MINDDY_SCHEDULER_URL: http://minddy:3000
        run: pnpm run verify:self-hosted-egress -- --egress-log test/fixtures/self-hosted-egress/minimal.json --profile minimal --report "$RUNNER_TEMP/self-hosted-egress-minimal.md"

      - name: Self-hosted provider egress contract
        env:
          MINDDY_PUBLIC_APP_URL: http://minddy:3000
          MINDDY_PUBLIC_SUPABASE_URL: https://project.supabase.co
          MINDDY_SCHEDULER_URL: http://minddy:3000
          EMAIL_PROVIDER: resend
          RESEND_API_KEY: test-resend-key
          FEEDBACK_EMAIL_FROM: feedback@example.test
          INVITATION_EMAIL_FROM: invitations@example.test
        run: pnpm run verify:self-hosted-egress -- --egress-log test/fixtures/self-hosted-egress/provider.json --profile provider --allow-host api.resend.com --report "$RUNNER_TEMP/self-hosted-egress-provider.md"

      - name: Self-hosted blocked-vendor egress diagnostic
        env:
          MINDDY_PUBLIC_APP_URL: http://minddy:3000
          MINDDY_PUBLIC_SUPABASE_URL: https://project.supabase.co
          MINDDY_SCHEDULER_URL: http://minddy:3000
        shell: bash
        run: |
          set +e
          pnpm run verify:self-hosted-egress -- --egress-log test/fixtures/self-hosted-egress/blocked-vendor.json --profile minimal --report "$RUNNER_TEMP/self-hosted-egress-blocked.md"
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'server → `api.stripe.com`: stripe is not enabled' "$RUNNER_TEMP/self-hosted-egress-blocked.md"
          ! grep -F '/v1/customers' "$RUNNER_TEMP/self-hosted-egress-blocked.md"

      # Keep the edition coverage on this already-initialized runner. Seven
      # separate matrix jobs repeated checkout, Node setup, and dependency
      # installation, which consumed more billed minutes than the tests.
      # Subshells prevent one fixture's exported values from leaking into the
      # next scenario.
      - name: Check all edition contracts
        shell: bash
        run: |
          for edition in \
            self-hosted-minimal \
            self-hosted-byok \
            minddy-cloud \
            managed-forge \
            partial-billing \
            partial-ai \
            implicit-identifiers
          do
            (
              set -a
              source "test/fixtures/editions/$edition.env"
              set +a
              pnpm exec vitest run lib/server/editions.integration.test.ts
            )
          done

      # Deployable editions must compile and open an HTTP port with the exact
      # fixture checked above. Partial variants remain covered by their contract
      # diagnostics and intentionally cannot start.
      - name: Build and start deployable editions
        shell: bash
        run: |
          for edition in self-hosted-minimal minddy-cloud managed-forge; do
            (
              set -a
              source "test/fixtures/editions/$edition.env"
              set +a
              pnpm run build
              log_file="$RUNNER_TEMP/minddy-$edition-start.log"
              pnpm exec next start -p 3100 > "$log_file" 2>&1 &
              server_pid=$!
              trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
              ready=0
              for attempt in {1..30}; do
                if curl --silent --show-error --output /dev/null http://127.0.0.1:3100/; then
                  ready=1
                  break
                fi
                sleep 1
              done
              if [ "$ready" -ne 1 ]; then
                sed -n '1,240p' "$log_file"
                exit 1
              fi
            )
          done

      - name: Upload self-hosted egress reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: self-hosted-egress-reports
          path: ${{ runner.temp }}/self-hosted-egress-*.md
          if-no-files-found: error
          retention-days: 7

  audit:
    name: Dependencies audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.28.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      #No installation: the audit reads the lockfiles, it does not need
      # the tree. The three lockfiles of the repository are covered by this script.
      - name: Audit (high+)
        run: node scripts/audit.mjs
