name: CodeQL

# Code scanning for the languages that need no build: the workflows, the C and
# C++ helpers and the web app. It runs on every pull request, because the
# `Protect main` ruleset requires CodeQL results before a merge.
#
# This replaces GitHub's default setup, which analysed Swift on a macOS runner
# for every pull request (10 to 17 minutes) and could not build the iOS shell.
# Swift has its own workflow, `codeql-swift.yml`, limited to `mobile/`. GitHub
# rejects uploads from these workflows while default setup is on, so default
# setup stays disabled (Settings → Code security → Code scanning).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
