name: Public desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Core version already released (without v prefix)"
        required: true
        type: string
      target:
        description: "Desktop platforms to publish"
        required: true
        default: all
        type: choice
        options:
          - all
          - windows

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: public-desktop-release
  cancel-in-progress: false

jobs:
  # macOS is signed and notarized on the maintainer's Mac: the Developer ID
  # certificate and the notarization credentials stay out of GitHub. See
  # docs/desktop-release.md for that publication and for the release record.
  linux:
    name: Build, sign and attach Linux v${{ inputs.version }}
    if: inputs.target == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: public-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate core release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git fetch origin "refs/tags/v$RELEASE_VERSION:refs/tags/v$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "v$RELEASE_VERSION")"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          test "$(node -p "require('./desktop/package.json').version")" = "$RELEASE_VERSION"
          gh release view "v$RELEASE_VERSION" >/dev/null

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: npm --prefix desktop ci --ignore-scripts
      - name: Install RPM build tooling
        run: sudo apt-get update && sudo apt-get install --yes rpm

      - name: Import the Linux release key
        env:
          MINDDY_LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          MINDDY_LINUX_GPG_FINGERPRINT: ${{ vars.LINUX_GPG_FINGERPRINT }}
        run: |
          test -n "$MINDDY_LINUX_GPG_PRIVATE_KEY"
          test -n "$MINDDY_LINUX_GPG_FINGERPRINT"
          install -d -m 700 "$RUNNER_TEMP/gnupg"
          printf '%s' "$MINDDY_LINUX_GPG_PRIVATE_KEY" | gpg --batch --homedir "$RUNNER_TEMP/gnupg" --import
          gpg --batch --homedir "$RUNNER_TEMP/gnupg" --list-secret-keys "$MINDDY_LINUX_GPG_FINGERPRINT"
          ACTUAL_FINGERPRINT="$(gpg --batch --homedir "$RUNNER_TEMP/gnupg" --with-colons --list-secret-keys "$MINDDY_LINUX_GPG_FINGERPRINT" | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$ACTUAL_FINGERPRINT" = "$MINDDY_LINUX_GPG_FINGERPRINT"
          echo "GNUPGHOME=$RUNNER_TEMP/gnupg" >> "$GITHUB_ENV"

      - name: Build Linux packages
        env:
          MINDDY_DESKTOP_FEED_URL: ${{ secrets.PUBLIC_DESKTOP_FEED_URL }}
        run: npm --prefix desktop run dist:linux

      - name: Verify Linux desktop integration and update metadata
        run: |
          test -f desktop/release/latest-linux.yml
          test -f desktop/release/latest-linux-arm64.yml
          test -n "$(find desktop/release -maxdepth 1 -name '*.AppImage' -print -quit)"
          deb_file="$(find desktop/release -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb_file"
          dpkg-deb --fsys-tarfile "$deb_file" | tar -xOf - ./usr/share/applications/minddy.desktop > "$RUNNER_TEMP/minddy.desktop"
          grep -Fx 'MimeType=x-scheme-handler/minddy;' "$RUNNER_TEMP/minddy.desktop"
          grep -Fx 'StartupWMClass=minddy' "$RUNNER_TEMP/minddy.desktop"

      - name: Sign Linux packages and update metadata
        env:
          MINDDY_LINUX_GPG_FINGERPRINT: ${{ vars.LINUX_GPG_FINGERPRINT }}
          MINDDY_LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: node scripts/sign-linux-desktop.mjs

      - name: Verify and publish the Linux update feed
        env:
          MINDDY_DESKTOP_FEED_URL: ${{ secrets.PUBLIC_DESKTOP_FEED_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.PUBLIC_DESKTOP_BLOB_READ_WRITE_TOKEN }}
          MINDDY_LINUX_GPG_FINGERPRINT: ${{ vars.LINUX_GPG_FINGERPRINT }}
        run: node scripts/publish-linux-desktop.mjs

      - name: Stage Linux desktop artifacts
        run: |
          mkdir .desktop-release-linux
          find desktop/release -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.asc' -o -name 'latest-linux*.yml' -o -name 'SHA256SUMS-linux-*' \) -exec cp {} .desktop-release-linux/ \;

      - name: Attest Linux desktop artifacts
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .desktop-release-linux/*

      - name: Attach Linux artifacts to the core release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release upload "v$RELEASE_VERSION" .desktop-release-linux/*

      - name: Publish the Linux signing fingerprint in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          MINDDY_LINUX_GPG_FINGERPRINT: ${{ vars.LINUX_GPG_FINGERPRINT }}
        run: |
          gh release view "v$RELEASE_VERSION" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
          node scripts/linux-release-notes.mjs \
            "$RUNNER_TEMP/release-notes.md" \
            "$RUNNER_TEMP/release-notes-with-linux-key.md" \
            "$MINDDY_LINUX_GPG_FINGERPRINT"
          gh release edit "v$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes-with-linux-key.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-release-${{ inputs.version }}
          path: .desktop-release-linux/
          if-no-files-found: ignore
          retention-days: 30

  windows:
    name: Build and attach Store MSIX v${{ inputs.version }}
    if: inputs.target == 'all' || inputs.target == 'windows'
    # Keep the v143 ARM64 tools used by the native helper projects available.
    runs-on: windows-2022
    timeout-minutes: 45
    environment: public-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate core release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git fetch origin "refs/tags/v$RELEASE_VERSION:refs/tags/v$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "v$RELEASE_VERSION")"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          test "$(node -p "require('./desktop/package.json').version")" = "$RELEASE_VERSION"
          gh release view "v$RELEASE_VERSION" >/dev/null

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: npm --prefix desktop ci --ignore-scripts

      - name: Build unsigned Store submission packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          MINDDY_WINDOWS_STORE_IDENTITY_NAME: ${{ vars.WINDOWS_STORE_IDENTITY_NAME }}
          MINDDY_WINDOWS_STORE_PUBLISHER: ${{ vars.WINDOWS_STORE_PUBLISHER }}
          # Reserved for the dormant WNS implementation. Both remain empty
          # until Entra identity and PFN mapping are deliberately activated.
          MINDDY_WINDOWS_WNS_APP_ID: ${{ vars.WINDOWS_WNS_APP_ID }}
          MINDDY_WINDOWS_WNS_OBJECT_ID: ${{ vars.WINDOWS_WNS_OBJECT_ID }}
        run: npm --prefix desktop run dist:win:store

      # Validation tooling follows the approved workflow revision while the
      # packaged application remains on its immutable release tag.
      - name: Load the approved Windows verifier
        shell: pwsh
        run: |
          $verifier = git show "$($env:GITHUB_SHA):scripts/verify-windows-desktop.ps1"
          if ($LASTEXITCODE -ne 0) { throw "The workflow revision has no Windows verifier." }
          $verifier | Set-Content "$env:RUNNER_TEMP/verify-windows-desktop.ps1" -Encoding utf8

      - name: Validate MSIX manifests with the Windows SDK
        shell: pwsh
        env:
          MINDDY_WINDOWS_STORE_IDENTITY_NAME: ${{ vars.WINDOWS_STORE_IDENTITY_NAME }}
          MINDDY_WINDOWS_STORE_PUBLISHER: ${{ vars.WINDOWS_STORE_PUBLISHER }}
          MINDDY_WINDOWS_WNS_APP_ID: ${{ vars.WINDOWS_WNS_APP_ID }}
        run: '& "$env:RUNNER_TEMP/verify-windows-desktop.ps1" -StoreDirectory "$env:GITHUB_WORKSPACE/desktop/release/windows-store"'

      # Partner Center requires unsigned submission packages. Sign only
      # disposable copies so the release can still exercise installation,
      # minddy:// activation, and uninstall on a clean Windows runner.
      - name: Create disposable MSIX test identity
        shell: pwsh
        run: |
          $password = ConvertTo-SecureString "minddy-ci-only" -AsPlainText -Force
          $certificate = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=D5052B10-735B-4EF0-920F-642DFBDEB04F" `
            -KeyUsage DigitalSignature `
            -FriendlyName "minddy CI" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          Export-PfxCertificate -Cert $certificate -FilePath "$env:RUNNER_TEMP\minddy-ci.pfx" -Password $password
          Export-Certificate -Cert $certificate -FilePath "$env:RUNNER_TEMP\minddy-ci.cer"
          Import-Certificate -FilePath "$env:RUNNER_TEMP\minddy-ci.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople

      - name: Sign and install disposable MSIX copies
        shell: pwsh
        env:
          MINDDY_WINDOWS_STORE_IDENTITY_NAME: ${{ vars.WINDOWS_STORE_IDENTITY_NAME }}
          MINDDY_WINDOWS_STORE_PUBLISHER: ${{ vars.WINDOWS_STORE_PUBLISHER }}
          MINDDY_WINDOWS_WNS_APP_ID: ${{ vars.WINDOWS_WNS_APP_ID }}
        run: |
          $testDirectory = "$env:RUNNER_TEMP\minddy-windows-store-test"
          New-Item -ItemType Directory -Force $testDirectory | Out-Null
          Copy-Item desktop/release/windows-store/*.msix $testDirectory/
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe was not found in the Windows SDK." }
          Get-ChildItem "$testDirectory\*.msix" | ForEach-Object {
            & $signTool.FullName sign /fd SHA256 /f "$env:RUNNER_TEMP\minddy-ci.pfx" /p "minddy-ci-only" $_.FullName | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "SignTool could not sign $($_.Name)." }
          }
          & "$env:RUNNER_TEMP/verify-windows-desktop.ps1" -InstallStore -StoreDirectory $testDirectory

      - name: Stage Windows desktop artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory .desktop-release-windows
          Copy-Item desktop/release/windows-store/*.msix .desktop-release-windows/
          Get-FileHash .desktop-release-windows/* -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content .desktop-release-windows/SHA256SUMS-Windows

      - name: Attest Windows desktop artifacts
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .desktop-release-windows/*

      - name: Document unavailable GitHub attestation
        if: github.event.repository.visibility != 'public'
        run: >-
          echo '::notice::GitHub artifact attestations are unavailable for a
          user-owned private repository; verify SHA256SUMS-Windows before Store
          submission.'

      - name: Attach Windows artifacts to the core release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release upload "v$RELEASE_VERSION" .desktop-release-windows/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-release-${{ inputs.version }}
          path: .desktop-release-windows/
          if-no-files-found: ignore
          retention-days: 30
