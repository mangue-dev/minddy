name: Promote production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Green hand SHA to promote without merge or rewrite"
        required: true
        type: string
      checklist_version:
        description: "Docs/security-release-checklist.md version used"
        required: true
        default: "1.0"
        type: string
      security_review_ref:
        description: "Stable reference of the review report (without sensitive data)"
        required: true
        type: string
      residual_risks:
        description: "Residual risks in the report"
        required: true
        type: choice
        options:
          - none
          - documented
      pentest_status:
        description: "Pentest decision according to the checklist"
        required: true
        type: choice
        options:
          - not-required
          - completed
          - required-not-completed

permissions:
  actions: read
  contents: write
  deployments: read

concurrency:
  # Shared with core release: production cannot progress for
  # that a workflow is building and then tagging its SHA.
  group: production-publication
  cancel-in-progress: false

jobs:
  security-review:
    name: Validate security release review
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      # This validation lives in the workflow itself: it cannot therefore be
      # be weakened by the candidate SHA before production approval.
      - name: Enforce current checklist and pentest decision
        env:
          CHECKLIST_VERSION: ${{ inputs.checklist_version }}
          SECURITY_REVIEW_REF: ${{ inputs.security_review_ref }}
          RESIDUAL_RISKS: ${{ inputs.residual_risks }}
          PENTEST_STATUS: ${{ inputs.pentest_status }}
        run: |
          test "$CHECKLIST_VERSION" = "1.0"
          test -n "$SECURITY_REVIEW_REF"
          test "${#SECURITY_REVIEW_REF}" -le 200
          review_ref_pattern='^[A-Za-z0-9._:/#?=&%+-]+$'
          [[ "$SECURITY_REVIEW_REF" =~ $review_ref_pattern ]] || { echo "Invalid security review reference"; exit 1; }
          case "$RESIDUAL_RISKS" in none|documented) ;; *) echo "Invalid residual risk status"; exit 1 ;; esac
          case "$PENTEST_STATUS" in
            not-required|completed) ;;
            required-not-completed) echo "Required pentest is not complete"; exit 1 ;;
            *) echo "Invalid pentest status"; exit 1 ;;
          esac

          {
            echo "### Release security review"
            echo "- Checklist: \`$CHECKLIST_VERSION\`"
            echo "- Report: \`$SECURITY_REVIEW_REF\`"
            echo "- Residual risks: \`$RESIDUAL_RISKS\`"
            echo "- Pentest: \`$PENTEST_STATUS\`"
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote and verify ${{ inputs.sha }}
    needs: security-review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloud-production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tested main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.sha }}
          SECURITY_REVIEW_REF: ${{ inputs.security_review_ref }}
          RESIDUAL_RISKS: ${{ inputs.residual_risks }}
          PENTEST_STATUS: ${{ inputs.pentest_status }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main production
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          git merge-base --is-ancestor origin/production "$TARGET_SHA"

          CI_RUN=$(gh run list \
            --workflow ci.yml \
            --branch main \
            --commit "$TARGET_SHA" \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          test -n "$CI_RUN"
          echo "Validated successful main CI run $CI_RUN for $TARGET_SHA"

          {
            echo "### Promotion requested"
            echo "- From: \`$(git rev-parse origin/production)\`"
            echo "- Vers: \`$TARGET_SHA\` (CI run $CI_RUN)"
            echo "- Security review: \`$SECURITY_REVIEW_REF\`"
            echo "- Residual risks: \`$RESIDUAL_RISKS\`"
            echo "- Pentest: \`$PENTEST_STATUS\`"
            echo ""
            echo "#### Changements Cloud"
            git log --format='- `%h` %s' "origin/production..$TARGET_SHA"
            echo ""
            echo "#### Marketing"
            marketing=$(git diff --name-only "origin/production..$TARGET_SHA" -- | grep -E '^app/\(marketing\)/|^components/marketing/|^public/(captures|marketing)/|^app/(sitemap\.ts|robots\.txt|llms(-full)?\.txt)' || true)
            if [ -n "$marketing" ]; then printf '%s\n' "$marketing" | sed 's/^/- `/' | sed 's/$/`/'; else echo "- No marketing changes."; fi
            echo ""
            echo "#### Migrations"
            migrations=$(git diff --name-only "origin/production..$TARGET_SHA" -- supabase/migrations || true)
            if [ -n "$migrations" ]; then printf '%s\n' "$migrations" | sed 's/^/- `/' | sed 's/$/`/'; else echo "- No SQL migrations."; fi
            echo ""
            echo "Updates and rollback: \`docs/releases.md\` and \`docs/self-hosting-operations.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fast-forward production
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push origin "$TARGET_SHA:refs/heads/production"
          test "$(git ls-remote origin refs/heads/production | cut -f1)" = "$TARGET_SHA"

      # The Git Vercel integration creates a GitHub Deployment named Production.
      # Waiting for its status makes the Cloud verdict traceable without Vercel token on
      # the maintainer's position nor in this workflow.
      - name: Verify Vercel production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          deployment_id=""
          deployment_url=""
          for attempt in $(seq 1 120); do
            if [ -z "$deployment_id" ]; then
              deployment_id=$(gh api \
                "repos/$GITHUB_REPOSITORY/deployments?sha=$TARGET_SHA&environment=Production&per_page=10" \
                --jq '.[0].id // empty')
            fi
            if [ -n "$deployment_id" ]; then
              state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" --jq '.[0].state // empty')
              deployment_url=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" --jq '.[0].environment_url // .[0].target_url // empty')
              case "$state" in
                success) break ;;
                error|failure|inactive) echo "Vercel deployment ended with $state"; exit 1 ;;
              esac
            fi
            sleep 10
          done
          test "${state:-}" = "success"
          {
            echo "### Minddy Cloud deployed"
            echo "- SHA: \`$TARGET_SHA\`"
            echo "- Vercel deployment: ${deployment_url:-GitHub Deployment $deployment_id}"
          } >> "$GITHUB_STEP_SUMMARY"
