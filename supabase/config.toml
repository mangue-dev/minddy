#Reproducible setup of minddy's local Supabase stack.
#
#App secrets don't live here: `pnpm bootstrap:supabase`
#writes them to `.env.local`, ignored by Git. Buckets and their policies
#live in migrations so that the same history also applies to a
#Remote self-hosted Supabase instance.
project_id = "minddy"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:6463"
additional_redirect_urls = ["http://localhost:*/auth/callback", "http://127.0.0.1:*/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true

[auth.email.template.confirmation]
subject = '{{ $locale := printf "%v" (index .Data "locale") }}{{ if eq $locale "fr" }}Confirmez votre adresse e-mail{{ else if eq $locale "de" }}Bestätige deine E-Mail-Adresse{{ else if eq $locale "pt-BR" }}Confirme seu endereço de e-mail{{ else if eq $locale "it" }}Conferma il tuo indirizzo email{{ else if eq $locale "es" }}Confirma tu dirección de correo{{ else }}Confirm your email{{ end }}'
content_path = "./supabase/email-templates/confirm-signup.html"

[auth.email.template.recovery]
subject = '{{ $locale := printf "%v" (index .Data "locale") }}{{ if eq $locale "fr" }}Réinitialisez votre mot de passe{{ else if eq $locale "de" }}Setze dein Passwort zurück{{ else if eq $locale "pt-BR" }}Redefina sua senha{{ else if eq $locale "it" }}Reimposta la password{{ else if eq $locale "es" }}Restablece tu contraseña{{ else }}Reset your password{{ end }}'
content_path = "./supabase/email-templates/reset-password.html"

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "25MiB"

#These declarations make the constraints visible to the local operator. THE
#INSERT/UPDATE idempotents of `supabase/migrations` remain the source of
#truth, because `supabase db push` is also the path of remote instances.
[storage.buckets.attachments]
public = false
file_size_limit = "20MiB"

[storage.buckets.project-icons]
public = true
file_size_limit = "25MiB"

[storage.buckets.user-avatars]
public = true
file_size_limit = "10MiB"

[storage.buckets.forge-attachments]
public = true
file_size_limit = "20MiB"
