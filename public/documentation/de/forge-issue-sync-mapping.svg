<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img"><title>GitHub-Issue-Synchronisierung</title><rect width="1100" height="720" fill="#fafafa" /><g font-family="Inter, Arial, sans-serif" fill="#18181b"><text x="32" y="46" font-size="25" font-weight="600" fill="#293d56"><tspan x="32" dy="0">GitHub-Issue-Synchronisierung</tspan></text><rect x="32" y="86" width="1036" height="106" rx="12" fill="#e6edf5" stroke="#293d56" stroke-opacity="0.12" stroke-width="1" /><text x="50" y="115" font-size="19" font-weight="600" fill="#293d56"><tspan x="50" dy="0">1. Einrichtung durch den Inhaber</tspan></text><text x="50" y="146" font-size="17" font-weight="400" fill="#293d56"><tspan x="50" dy="0">Repository verknüpfen, Issues lesen/schreiben erlauben und Synchronisierung aktivieren.</tspan></text><path d="M550 193v14m-5-5 5 5 5-5" stroke="#60706b" stroke-width="1.5" fill="none" /><rect x="32" y="212" width="1036" height="106" rx="12" fill="#e0efe8" stroke="#1e4436" stroke-opacity="0.12" stroke-width="1" /><text x="50" y="241" font-size="19" font-weight="600" fill="#293d56"><tspan x="50" dy="0">2. Eingehende Ereignisse</tspan></text><text x="50" y="272" font-size="17" font-weight="400" fill="#293d56"><tspan x="50" dy="0">Zustellungs-IDs deduplizieren; ältere Daten überschreiben keine neueren lokalen Änderungen.</tspan></text><path d="M550 319v14m-5-5 5 5 5-5" stroke="#60706b" stroke-width="1.5" fill="none" /><rect x="32" y="338" width="1036" height="106" rx="12" fill="#f0ecf6" stroke="#433352" stroke-opacity="0.12" stroke-width="1" /><text x="50" y="367" font-size="19" font-weight="600" fill="#293d56"><tspan x="50" dy="0">3. Import und Zuordnung</tspan></text><text x="50" y="398" font-size="17" font-weight="400" fill="#293d56"><tspan x="50" dy="0">Importierte Issues landen in der Triage. Titel/Text werden Titel/Beschreibung; Labels liefern Kategorien</tspan><tspan x="50" dy="23.799999999999997">und erkannte Priorität/Aufwand.</tspan></text><path d="M550 445v14m-5-5 5 5 5-5" stroke="#60706b" stroke-width="1.5" fill="none" /><rect x="32" y="464" width="1036" height="106" rx="12" fill="#f7ecdf" stroke="#573e28" stroke-opacity="0.12" stroke-width="1" /><text x="50" y="493" font-size="19" font-weight="600" fill="#293d56"><tspan x="50" dy="0">4. Statusabgleich</tspan></text><text x="50" y="524" font-size="17" font-weight="400" fill="#293d56"><tspan x="50" dy="0">Offen/geschlossen wird in beide Richtungen gespiegelt. Bei konkurrierenden Änderungen Zeitstempel</tspan><tspan x="50" dy="23.799999999999997">vergleichen.</tspan></text><text x="32" y="633" font-size="17" font-weight="400" fill="#293d56"><tspan x="32" dy="0">Kommentare behalten die entfernte Identität und werden nicht doppelt angelegt. GitLab-Zuordnungen können</tspan><tspan x="32" dy="23.799999999999997">abweichen.</tspan></text></g></svg>
