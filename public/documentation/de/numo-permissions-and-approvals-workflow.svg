<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" role="img"><title>Numo: Zugriff und Autorisierung</title><rect width="1100" height="790" fill="#fafafa"/><g font-family="Inter, Arial, sans-serif" fill="#18181b"><text x="32" y="46" font-size="25" font-weight="600"><tspan x="32" dy="0">Numo: Zugriff und Autorisierung</tspan></text><text x="44" y="94" font-size="17" font-weight="600"><tspan x="44" dy="0">Aktion oder Kontext</tspan></text><text x="377" y="94" font-size="17" font-weight="600"><tspan x="377" dy="0">Wer autorisiert</tspan></text><text x="712" y="94" font-size="17" font-weight="600"><tspan x="712" dy="0">Grenze</tspan></text><rect x="32" y="114" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="140" font-size="17" font-weight="600"><tspan x="44" dy="0">Projektarbeit</tspan></text><text x="377" y="140" font-size="17" font-weight="400"><tspan x="377" dy="0">Mitglied mit Projektzugriff</tspan></text><text x="712" y="140" font-size="17" font-weight="400"><tspan x="712" dy="0">Die bestehenden</tspan><tspan x="712" dy="23.799999999999997">Projektberechtigungen gelten</tspan><tspan x="712" dy="23.799999999999997">weiterhin</tspan></text><rect x="32" y="202" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="228" font-size="17" font-weight="600"><tspan x="44" dy="0">Inhabereinstellungen</tspan></text><text x="377" y="228" font-size="17" font-weight="400"><tspan x="377" dy="0">Projektinhaber</tspan></text><text x="712" y="228" font-size="17" font-weight="400"><tspan x="712" dy="0">Mitglieder, Repository und</tspan><tspan x="712" dy="23.799999999999997">Feedback-Einstellungen</tspan></text><rect x="32" y="290" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="316" font-size="17" font-weight="600"><tspan x="44" dy="0">Zugangsdaten und Sicherheit</tspan></text><text x="377" y="316" font-size="17" font-weight="400"><tspan x="377" dy="0">Kontoinhaber, in den</tspan><tspan x="377" dy="23.799999999999997">Einstellungen</tspan></text><text x="712" y="316" font-size="17" font-weight="400"><tspan x="712" dy="0">Schlüssel, Git und</tspan><tspan x="712" dy="23.799999999999997">Zwei-Faktor-Authentifizierung</tspan><tspan x="712" dy="23.799999999999997">direkt einrichten</tspan></text><rect x="32" y="378" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="404" font-size="17" font-weight="600"><tspan x="44" dy="0">Öffentliche Feedback-Antwort</tspan></text><text x="377" y="404" font-size="17" font-weight="400"><tspan x="377" dy="0">Ausdrücklicher Benutzerauftrag</tspan></text><text x="712" y="404" font-size="17" font-weight="400"><tspan x="712" dy="0">Lesen einer Anfrage erlaubt keine</tspan><tspan x="712" dy="23.799999999999997">öffentliche Antwort</tspan></text><rect x="32" y="466" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="492" font-size="17" font-weight="600"><tspan x="44" dy="0">Persönliches MCP</tspan></text><text x="377" y="492" font-size="17" font-weight="400"><tspan x="377" dy="0">Auftraggeber des Gesprächs</tspan></text><text x="712" y="492" font-size="17" font-weight="400"><tspan x="712" dy="0">Keine persönlichen Verbindungen</tspan><tspan x="712" dy="23.799999999999997">anderer Mitglieder</tspan></text><rect x="32" y="554" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="580" font-size="17" font-weight="600"><tspan x="44" dy="0">Geplante Routine</tspan></text><text x="377" y="580" font-size="17" font-weight="400"><tspan x="377" dy="0">Aktueller Projektinhaber</tspan></text><text x="712" y="580" font-size="17" font-weight="400"><tspan x="712" dy="0">Verbindungen und KI-Budget des</tspan><tspan x="712" dy="23.799999999999997">Inhabers</tspan></text><rect x="32" y="642" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="668" font-size="17" font-weight="600"><tspan x="44" dy="0">Entferntes MCP-Ergebnis</tspan></text><text x="377" y="668" font-size="17" font-weight="400"><tspan x="377" dy="0">Nicht vertrauenswürdiger</tspan><tspan x="377" dy="23.799999999999997">Dienstinhalt</tspan></text><text x="712" y="668" font-size="17" font-weight="400"><tspan x="712" dy="0">Kann keine weiteren Aktionen</tspan><tspan x="712" dy="23.799999999999997">autorisieren</tspan></text></g></svg>