<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc">
<title id="title">Datenflüsse zwischen Anwendung, Datenbank und Anbietern</title>
<desc id="desc">Diagramm: Browser und authentifizierte Anwendung. Supabase: PostgreSQL, Auth, Storage, Realtime. Unabhängiger Scheduler und vertrauenswürdiger Runner. Optionale Anbieter: getrennte Datenziele.</desc>
<rect width="720" height="640" rx="20" fill="#fafaf9" />
<rect x="24" y="24" width="672" height="128" rx="16" fill="#e6edf5" stroke="#293d56" stroke-width="1" stroke-opacity="0.12" />
<text x="48" y="98" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Browser und authentifizierte Anwendung</text>
<rect x="24" y="178" width="672" height="128" rx="16" fill="#e0efe8" stroke="#1e4436" stroke-width="1" stroke-opacity="0.12" />
<text x="48" y="235" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Supabase: PostgreSQL, Auth, Storage,</text>
<text x="48" y="269" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Realtime</text>
<rect x="24" y="332" width="672" height="128" rx="16" fill="#f0ecf6" stroke="#433352" stroke-width="1" stroke-opacity="0.12" />
<text x="48" y="389" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Unabhängiger Scheduler und</text>
<text x="48" y="423" font-family="Arial, sans-serif" font-size="29" fill="#293d56">vertrauenswürdiger Runner</text>
<rect x="24" y="486" width="672" height="128" rx="16" fill="#f7ecdf" stroke="#573e28" stroke-width="1" stroke-opacity="0.12" />
<text x="48" y="543" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Optionale Anbieter: getrennte</text>
<text x="48" y="577" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Datenziele</text>
</svg>
