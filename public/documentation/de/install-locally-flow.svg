<text x="48" y="98" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Desktop-App wählt den Klon</text>
<rect x="24" y="178" width="672" height="128" rx="16" fill="#e0efe8" stroke="#1e4436" stroke-width="1" stroke-opacity="0.12" />
<text x="48" y="252" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Loopback-Anwendung: Port 6463</text>
<rect x="24" y="332" width="672" height="128" rx="16" fill="#f0ecf6" stroke="#433352" stroke-width="1" stroke-opacity="0.12" />
<text x="48" y="389" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Minimales Supabase und dauerhafte</text>
<text x="48" y="423" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Daten</text>
<rect x="24" y="486" width="672" height="128" rx="16" fill="#f7ecdf" stroke="#573e28" stroke-width="1" stroke-opacity="0.12" />
<text x="48" y="560" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Beenden stoppt App und Backend</text>
