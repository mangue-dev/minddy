<text x="98" y="81" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">Server hält</text>
<text x="98" y="115" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">Projektintegrationsschlüssel</text>
