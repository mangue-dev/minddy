<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img"><title>Zwei getrennte Feedback-Abläufe</title><rect width="1100" height="760" fill="#fafafa"/><g font-family="Inter, Arial, sans-serif" fill="#18181b"><text x="32" y="46" font-size="25" font-weight="600"><tspan x="32" dy="0">Zwei getrennte Feedback-Abläufe</tspan></text><text x="32" y="95" font-size="19" font-weight="600"><tspan x="32" dy="0">Serverseitige Erfassung</tspan></text><rect x="32" y="116" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="50" y="148" font-size="18" font-weight="400"><tspan x="50" dy="0">Backend verwahrt den Feedback-Schlüssel</tspan></text><path d="M279 223v22m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="32" y="246" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="50" y="278" font-size="18" font-weight="400"><tspan x="50" dy="0">POST /api/v1/feedback mit Bearer-Schlüssel</tspan><tspan x="50" dy="25.2">und stabiler Identität</tspan></text><path d="M279 353v22m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="32" y="376" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="50" y="408" font-size="18" font-weight="400"><tspan x="50" dy="0">HTTP 201: gespeicherter Beitrag im</tspan><tspan x="50" dy="25.2">Team-Eingang; Board darf deaktiviert sein</tspan></text><text x="574" y="95" font-size="19" font-weight="600"><tspan x="574" dy="0">SSO für Browserbesucher</tspan></text><rect x="574" y="116" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="592" y="148" font-size="18" font-weight="400"><tspan x="592" dy="0">Backend verwahrt das separate</tspan><tspan x="592" dy="25.2">Board-SSO-Geheimnis</tspan></text><path d="M821 223v22m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="574" y="246" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="592" y="278" font-size="18" font-weight="400"><tspan x="592" dy="0">HS256-JWT signieren: sub, exp, eindeutige</tspan><tspan x="592" dy="25.2">jti; Gültigkeit ≤ 600 s</tspan></text><path d="M821 353v22m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="574" y="376" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="592" y="408" font-size="18" font-weight="400"><tspan x="592" dy="0">Browser zu /f/&lt;board-token&gt;?sso=&lt;jwt&gt;</tspan><tspan x="592" dy="25.2">umleiten</tspan></text><path d="M821 483v22m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="574" y="506" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="592" y="538" font-size="18" font-weight="400"><tspan x="592" dy="0">Einmaliges Token erstellt Besuchersitzung;</tspan><tspan x="592" dy="25.2">Mein Feedback öffnen</tspan></text><text x="32" y="688" font-size="17" font-weight="400"><tspan x="32" dy="0">Erfassungsschlüssel und SSO-Geheimnis niemals an Browsercode senden. Uhrtoleranz: 60 s.</tspan></text></g></svg>