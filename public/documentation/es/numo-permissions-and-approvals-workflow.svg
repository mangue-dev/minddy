<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" role="img"><title>Numo: acceso y autorización</title><rect width="1100" height="790" fill="#fafafa"/><g font-family="Inter, Arial, sans-serif" fill="#18181b"><text x="32" y="46" font-size="25" font-weight="600"><tspan x="32" dy="0">Numo: acceso y autorización</tspan></text><text x="44" y="94" font-size="17" font-weight="600"><tspan x="44" dy="0">Acción o contexto</tspan></text><text x="377" y="94" font-size="17" font-weight="600"><tspan x="377" dy="0">Quién autoriza</tspan></text><text x="712" y="94" font-size="17" font-weight="600"><tspan x="712" dy="0">Límite</tspan></text><rect x="32" y="114" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="140" font-size="17" font-weight="600"><tspan x="44" dy="0">Trabajo del proyecto</tspan></text><text x="377" y="140" font-size="17" font-weight="400"><tspan x="377" dy="0">Miembro con acceso al proyecto</tspan></text><text x="712" y="140" font-size="17" font-weight="400"><tspan x="712" dy="0">Se siguen aplicando los permisos</tspan><tspan x="712" dy="23.799999999999997">del proyecto</tspan></text><rect x="32" y="202" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="228" font-size="17" font-weight="600"><tspan x="44" dy="0">Ajustes del propietario</tspan></text><text x="377" y="228" font-size="17" font-weight="400"><tspan x="377" dy="0">Propietario del proyecto</tspan></text><text x="712" y="228" font-size="17" font-weight="400"><tspan x="712" dy="0">Miembros, repositorio y ajustes</tspan><tspan x="712" dy="23.799999999999997">de feedback</tspan></text><rect x="32" y="290" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="316" font-size="17" font-weight="600"><tspan x="44" dy="0">Credenciales y seguridad</tspan></text><text x="377" y="316" font-size="17" font-weight="400"><tspan x="377" dy="0">Titular de la cuenta, en ajustes</tspan></text><text x="712" y="316" font-size="17" font-weight="400"><tspan x="712" dy="0">Configurar claves, Git y doble</tspan><tspan x="712" dy="23.799999999999997">factor directamente</tspan></text><rect x="32" y="378" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="404" font-size="17" font-weight="600"><tspan x="44" dy="0">Respuesta pública al feedback</tspan></text><text x="377" y="404" font-size="17" font-weight="400"><tspan x="377" dy="0">Petición explícita del usuario</tspan></text><text x="712" y="404" font-size="17" font-weight="400"><tspan x="712" dy="0">Leer una petición no autoriza una</tspan><tspan x="712" dy="23.799999999999997">respuesta pública</tspan></text><rect x="32" y="466" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="492" font-size="17" font-weight="600"><tspan x="44" dy="0">MCP personal</tspan></text><text x="377" y="492" font-size="17" font-weight="400"><tspan x="377" dy="0">Quien solicita la conversación</tspan></text><text x="712" y="492" font-size="17" font-weight="400"><tspan x="712" dy="0">Sin conexiones personales de</tspan><tspan x="712" dy="23.799999999999997">otros miembros</tspan></text><rect x="32" y="554" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="580" font-size="17" font-weight="600"><tspan x="44" dy="0">Rutina programada</tspan></text><text x="377" y="580" font-size="17" font-weight="400"><tspan x="377" dy="0">Propietario actual del proyecto</tspan></text><text x="712" y="580" font-size="17" font-weight="400"><tspan x="712" dy="0">Conexiones y presupuesto de IA</tspan><tspan x="712" dy="23.799999999999997">del propietario</tspan></text><rect x="32" y="642" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="668" font-size="17" font-weight="600"><tspan x="44" dy="0">Resultado MCP remoto</tspan></text><text x="377" y="668" font-size="17" font-weight="400"><tspan x="377" dy="0">Contenido externo no fiable</tspan></text><text x="712" y="668" font-size="17" font-weight="400"><tspan x="712" dy="0">No puede autorizar acciones</tspan><tspan x="712" dy="23.799999999999997">adicionales</tspan></text></g></svg>