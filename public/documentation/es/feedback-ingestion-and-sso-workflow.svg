<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img"><title>Dos flujos de feedback separados</title><rect width="1100" height="760" fill="#fafafa"/><g font-family="Inter, Arial, sans-serif" fill="#18181b"><text x="32" y="46" font-size="25" font-weight="600"><tspan x="32" dy="0">Dos flujos de feedback separados</tspan></text><text x="32" y="95" font-size="19" font-weight="600"><tspan x="32" dy="0">Recogida desde el servidor</tspan></text><rect x="32" y="116" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="50" y="148" font-size="18" font-weight="400"><tspan x="50" dy="0">El backend guarda la clave de feedback</tspan></text><path d="M279 223v22m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="32" y="246" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="50" y="278" font-size="18" font-weight="400"><tspan x="50" dy="0">POST /api/v1/feedback con clave Bearer e</tspan><tspan x="50" dy="25.2">identidad estable</tspan></text><path d="M279 353v22m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="32" y="376" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="50" y="408" font-size="18" font-weight="400"><tspan x="50" dy="0">HTTP 201: post guardado en la bandeja del</tspan><tspan x="50" dy="25.2">equipo; el tablero puede estar desactivado</tspan></text><text x="574" y="95" font-size="19" font-weight="600"><tspan x="574" dy="0">SSO del visitante del navegador</tspan></text><rect x="574" y="116" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="592" y="148" font-size="18" font-weight="400"><tspan x="592" dy="0">El backend guarda el secreto SSO separado</tspan><tspan x="592" dy="25.2">del tablero</tspan></text><path d="M821 223v22m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="574" y="246" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="592" y="278" font-size="18" font-weight="400"><tspan x="592" dy="0">Firmar JWT HS256: sub, exp, jti único;</tspan><tspan x="592" dy="25.2">validez ≤ 600 s</tspan></text><path d="M821 353v22m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="574" y="376" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="592" y="408" font-size="18" font-weight="400"><tspan x="592" dy="0">Redirigir navegador a</tspan><tspan x="592" dy="25.2">/f/&lt;board-token&gt;?sso=&lt;jwt&gt;</tspan></text><path d="M821 483v22m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="574" y="506" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="592" y="538" font-size="18" font-weight="400"><tspan x="592" dy="0">Token de un solo uso crea sesión; abrir Mis</tspan><tspan x="592" dy="25.2">sugerencias</tspan></text><text x="32" y="688" font-size="17" font-weight="400"><tspan x="32" dy="0">Nunca enviar la clave de recogida ni el secreto SSO al navegador. Tolerancia de reloj: 60 s.</tspan></text></g></svg>