<text x="48" y="252" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Objeto privado o publicación explícita</text>
<rect x="24" y="332" width="672" height="128" rx="16" fill="#f0ecf6" stroke="#433352" stroke-width="1" stroke-opacity="0.12" />
<text x="48" y="389" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Solo conjunto publicado y archivos</text>
