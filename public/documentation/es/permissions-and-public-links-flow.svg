<rect x="24" y="486" width="672" height="128" rx="16" fill="#f7ecdf" stroke="#573e28" stroke-width="1" stroke-opacity="0.12" />
<text x="48" y="543" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Revocar enlace; archivos caducan</text>
