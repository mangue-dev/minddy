<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img"><title>Sincronización de issues de GitHub</title><rect width="1100" height="720" fill="#fafafa"/><g font-family="Inter, Arial, sans-serif" fill="#18181b"><text x="32" y="46" font-size="25" font-weight="600"><tspan x="32" dy="0">Sincronización de issues de GitHub</tspan></text><rect x="32" y="86" width="1036" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="50" y="115" font-size="19" font-weight="600"><tspan x="50" dy="0">1. Configuración del propietario</tspan></text><text x="50" y="146" font-size="17" font-weight="400"><tspan x="50" dy="0">Vincular repositorio, conceder lectura/escritura de Issues y activar sincronización.</tspan></text><path d="M550 193v14m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="32" y="212" width="1036" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="50" y="241" font-size="19" font-weight="600"><tspan x="50" dy="0">2. Eventos entrantes</tspan></text><text x="50" y="272" font-size="17" font-weight="400"><tspan x="50" dy="0">Deduplicar identificadores de entrega; rechazar datos anteriores a cambios locales más recientes.</tspan></text><path d="M550 319v14m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="32" y="338" width="1036" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="50" y="367" font-size="19" font-weight="600"><tspan x="50" dy="0">3. Importación y correspondencias</tspan></text><text x="50" y="398" font-size="17" font-weight="400"><tspan x="50" dy="0">Los issues importados entran en triage. Título/cuerpo se convierten en título/descripción; las etiquetas</tspan><tspan x="50" dy="23.799999999999997">aportan categorías, prioridad y esfuerzo reconocidos.</tspan></text><path d="M550 445v14m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="32" y="464" width="1036" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="50" y="493" font-size="19" font-weight="600"><tspan x="50" dy="0">4. Sincronización del estado</tspan></text><text x="50" y="524" font-size="17" font-weight="400"><tspan x="50" dy="0">Los estados abierto/cerrado se reflejan en ambos sentidos. Comparar fechas cuando compiten cambios.</tspan></text><text x="32" y="633" font-size="17" font-weight="400"><tspan x="32" dy="0">Los comentarios conservan la identidad remota sin duplicarse. Las correspondencias de GitLab pueden variar.</tspan></text></g></svg>