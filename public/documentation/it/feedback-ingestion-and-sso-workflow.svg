<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img"><title>Due flussi di feedback separati</title><rect width="1100" height="760" fill="#fafafa"/><g font-family="Inter, Arial, sans-serif" fill="#18181b"><text x="32" y="46" font-size="25" font-weight="600"><tspan x="32" dy="0">Due flussi di feedback separati</tspan></text><text x="32" y="95" font-size="19" font-weight="600"><tspan x="32" dy="0">Acquisizione dal server</tspan></text><rect x="32" y="116" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="50" y="148" font-size="18" font-weight="400"><tspan x="50" dy="0">Il backend conserva la chiave feedback</tspan></text><path d="M279 223v22m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="32" y="246" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="50" y="278" font-size="18" font-weight="400"><tspan x="50" dy="0">POST /api/v1/feedback con chiave Bearer e</tspan><tspan x="50" dy="25.2">identità stabile</tspan></text><path d="M279 353v22m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="32" y="376" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="50" y="408" font-size="18" font-weight="400"><tspan x="50" dy="0">HTTP 201: post salvato nella casella team;</tspan><tspan x="50" dy="25.2">la bacheca può essere disattivata</tspan></text><text x="574" y="95" font-size="19" font-weight="600"><tspan x="574" dy="0">SSO del visitatore nel browser</tspan></text><rect x="574" y="116" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="592" y="148" font-size="18" font-weight="400"><tspan x="592" dy="0">Il backend conserva il segreto SSO separato</tspan><tspan x="592" dy="25.2">della bacheca</tspan></text><path d="M821 223v22m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="574" y="246" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="592" y="278" font-size="18" font-weight="400"><tspan x="592" dy="0">Firmare JWT HS256: sub, exp, jti unico;</tspan><tspan x="592" dy="25.2">validità ≤ 600 s</tspan></text><path d="M821 353v22m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="574" y="376" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="592" y="408" font-size="18" font-weight="400"><tspan x="592" dy="0">Reindirizzare il browser a</tspan><tspan x="592" dy="25.2">/f/&lt;board-token&gt;?sso=&lt;jwt&gt;</tspan></text><path d="M821 483v22m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="574" y="506" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="592" y="538" font-size="18" font-weight="400"><tspan x="592" dy="0">Token monouso crea sessione; aprire Il mio</tspan><tspan x="592" dy="25.2">feedback</tspan></text><text x="32" y="688" font-size="17" font-weight="400"><tspan x="32" dy="0">Mai inviare chiave di acquisizione o segreto SSO al browser. Tolleranza orologio: 60 s.</tspan></text></g></svg>