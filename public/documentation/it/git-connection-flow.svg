<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580" role="img"><title>Collegare un account, poi un repository</title><rect width="720" height="580" rx="20" fill="#fafaf9"/><rect x="24" y="24" width="672" height="152" rx="16" fill="#e6edf5"/><g font-family="Arial, sans-serif" fill="#293d56"><text x="48" y="60" font-size="22" font-weight="600">1. Account Git personale</text><text x="48" y="99" font-size="20">Autorizza GitHub o GitLab per i repository di cui hai</text><text x="48" y="125" font-size="20">bisogno.</text></g><path d="M360 181v16m-5-5 5 5 5-5" fill="none" stroke="#60706b"/><rect x="24" y="204" width="672" height="152" rx="16" fill="#e0efe8"/><g font-family="Arial, sans-serif" fill="#1e4436"><text x="48" y="240" font-size="22" font-weight="600">2. Proprietario del progetto</text><text x="48" y="279" font-size="20">Scegli un repository disponibile nelle impostazioni Git</text><text x="48" y="305" font-size="20">del progetto.</text></g><path d="M360 361v16m-5-5 5 5 5-5" fill="none" stroke="#60706b"/><rect x="24" y="384" width="672" height="152" rx="16" fill="#f0ecf6"/><g font-family="Arial, sans-serif" fill="#433352"><text x="48" y="420" font-size="22" font-weight="600">3. Repository collegato</text><text x="48" y="459" font-size="20">Aurora → aurora/web. La sincronizzazione dei ticket è una</text><text x="48" y="485" font-size="20">scelta separata.</text></g></svg>
