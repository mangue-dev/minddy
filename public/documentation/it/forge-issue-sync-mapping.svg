<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img"><title>Sincronizzazione dei ticket GitHub</title><rect width="1100" height="720" fill="#fafafa" /><g font-family="Inter, Arial, sans-serif" fill="#18181b"><text x="32" y="46" font-size="25" font-weight="600" fill="#293d56"><tspan x="32" dy="0">Sincronizzazione dei ticket GitHub</tspan></text><rect x="32" y="86" width="1036" height="106" rx="12" fill="#e6edf5" stroke="#293d56" stroke-opacity="0.12" stroke-width="1" /><text x="50" y="115" font-size="19" font-weight="600" fill="#293d56"><tspan x="50" dy="0">1. Configurazione del proprietario</tspan></text><text x="50" y="146" font-size="17" font-weight="400" fill="#293d56"><tspan x="50" dy="0">Collegare il repository, concedere lettura/scrittura Issues e attivare la sincronizzazione.</tspan></text><path d="M550 193v14m-5-5 5 5 5-5" stroke="#60706b" stroke-width="1.5" fill="none" /><rect x="32" y="212" width="1036" height="106" rx="12" fill="#e0efe8" stroke="#1e4436" stroke-opacity="0.12" stroke-width="1" /><text x="50" y="241" font-size="19" font-weight="600" fill="#293d56"><tspan x="50" dy="0">2. Eventi in ingresso</tspan></text><text x="50" y="272" font-size="17" font-weight="400" fill="#293d56"><tspan x="50" dy="0">Deduplicare gli ID di consegna; i dati più vecchi non sovrascrivono modifiche locali più recenti.</tspan></text><path d="M550 319v14m-5-5 5 5 5-5" stroke="#60706b" stroke-width="1.5" fill="none" /><rect x="32" y="338" width="1036" height="106" rx="12" fill="#f0ecf6" stroke="#433352" stroke-opacity="0.12" stroke-width="1" /><text x="50" y="367" font-size="19" font-weight="600" fill="#293d56"><tspan x="50" dy="0">3. Importazione e corrispondenze</tspan></text><text x="50" y="398" font-size="17" font-weight="400" fill="#293d56"><tspan x="50" dy="0">I ticket importati entrano nel triage. Titolo/corpo diventano titolo/descrizione; le etichette forniscono</tspan><tspan x="50" dy="23.799999999999997">categorie, priorità e impegno riconosciuti.</tspan></text><path d="M550 445v14m-5-5 5 5 5-5" stroke="#60706b" stroke-width="1.5" fill="none" /><rect x="32" y="464" width="1036" height="106" rx="12" fill="#f7ecdf" stroke="#573e28" stroke-opacity="0.12" stroke-width="1" /><text x="50" y="493" font-size="19" font-weight="600" fill="#293d56"><tspan x="50" dy="0">4. Stato sincronizzato</tspan></text><text x="50" y="524" font-size="17" font-weight="400" fill="#293d56"><tspan x="50" dy="0">Gli stati aperto/chiuso si riflettono in entrambe le direzioni. Confrontare gli orari in caso di</tspan><tspan x="50" dy="23.799999999999997">modifiche concorrenti.</tspan></text><text x="32" y="633" font-size="17" font-weight="400" fill="#293d56"><tspan x="32" dy="0">I commenti conservano l’identità remota senza duplicati. Le corrispondenze GitLab possono differire.</tspan></text></g></svg>
