<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" role="img"><title>Numo: accesso e autorizzazione</title><rect width="1100" height="790" fill="#fafafa" /><g font-family="Inter, Arial, sans-serif" fill="#18181b"><text x="32" y="46" font-size="25" font-weight="600" fill="#293d56"><tspan x="32" dy="0">Numo: accesso e autorizzazione</tspan></text><text x="44" y="94" font-size="17" font-weight="600" fill="#293d56"><tspan x="44" dy="0">Azione o contesto</tspan></text><text x="377" y="94" font-size="17" font-weight="600" fill="#293d56"><tspan x="377" dy="0">Chi autorizza</tspan></text><text x="712" y="94" font-size="17" font-weight="600" fill="#293d56"><tspan x="712" dy="0">Limite</tspan></text><rect x="32" y="114" width="1036" height="78" rx="12" fill="#e6edf5" stroke="#293d56" stroke-opacity="0.12" stroke-width="1" /><text x="44" y="140" font-size="17" font-weight="600" fill="#293d56"><tspan x="44" dy="0">Lavoro del progetto</tspan></text><text x="377" y="140" font-size="17" font-weight="400" fill="#293d56"><tspan x="377" dy="0">Membro con accesso al progetto</tspan></text><text x="712" y="140" font-size="17" font-weight="400" fill="#293d56"><tspan x="712" dy="0">Restano validi i permessi del</tspan><tspan x="712" dy="23.799999999999997">progetto</tspan></text><rect x="32" y="202" width="1036" height="78" rx="12" fill="#e0efe8" stroke="#1e4436" stroke-opacity="0.12" stroke-width="1" /><text x="44" y="228" font-size="17" font-weight="600" fill="#293d56"><tspan x="44" dy="0">Impostazioni del proprietario</tspan></text><text x="377" y="228" font-size="17" font-weight="400" fill="#293d56"><tspan x="377" dy="0">Proprietario del progetto</tspan></text><text x="712" y="228" font-size="17" font-weight="400" fill="#293d56"><tspan x="712" dy="0">Membri, repository e impostazioni</tspan><tspan x="712" dy="23.799999999999997">feedback</tspan></text><rect x="32" y="290" width="1036" height="78" rx="12" fill="#f0ecf6" stroke="#433352" stroke-opacity="0.12" stroke-width="1" /><text x="44" y="316" font-size="17" font-weight="600" fill="#293d56"><tspan x="44" dy="0">Credenziali e sicurezza</tspan></text><text x="377" y="316" font-size="17" font-weight="400" fill="#293d56"><tspan x="377" dy="0">Titolare dell’account, nelle</tspan><tspan x="377" dy="23.799999999999997">impostazioni</tspan></text><text x="712" y="316" font-size="17" font-weight="400" fill="#293d56"><tspan x="712" dy="0">Configurare direttamente chiavi,</tspan><tspan x="712" dy="23.799999999999997">Git e secondo fattore</tspan></text><rect x="32" y="378" width="1036" height="78" rx="12" fill="#f7ecdf" stroke="#573e28" stroke-opacity="0.12" stroke-width="1" /><text x="44" y="404" font-size="17" font-weight="600" fill="#293d56"><tspan x="44" dy="0">Risposta pubblica a un feedback</tspan></text><text x="377" y="404" font-size="17" font-weight="400" fill="#293d56"><tspan x="377" dy="0">Richiesta esplicita dell’utente</tspan></text><text x="712" y="404" font-size="17" font-weight="400" fill="#293d56"><tspan x="712" dy="0">Leggere una richiesta non</tspan><tspan x="712" dy="23.799999999999997">autorizza una risposta pubblica</tspan></text><rect x="32" y="466" width="1036" height="78" rx="12" fill="#e6edf5" stroke="#293d56" stroke-opacity="0.12" stroke-width="1" /><text x="44" y="492" font-size="17" font-weight="600" fill="#293d56"><tspan x="44" dy="0">MCP personale</tspan></text><text x="377" y="492" font-size="17" font-weight="400" fill="#293d56"><tspan x="377" dy="0">Autore della conversazione</tspan></text><text x="712" y="492" font-size="17" font-weight="400" fill="#293d56"><tspan x="712" dy="0">Nessuna connessione personale di</tspan><tspan x="712" dy="23.799999999999997">altri membri</tspan></text><rect x="32" y="554" width="1036" height="78" rx="12" fill="#e0efe8" stroke="#1e4436" stroke-opacity="0.12" stroke-width="1" /><text x="44" y="580" font-size="17" font-weight="600" fill="#293d56"><tspan x="44" dy="0">Routine pianificata</tspan></text><text x="377" y="580" font-size="17" font-weight="400" fill="#293d56"><tspan x="377" dy="0">Proprietario attuale del progetto</tspan></text><text x="712" y="580" font-size="17" font-weight="400" fill="#293d56"><tspan x="712" dy="0">Connessioni e budget IA del</tspan><tspan x="712" dy="23.799999999999997">proprietario</tspan></text><rect x="32" y="642" width="1036" height="78" rx="12" fill="#f0ecf6" stroke="#433352" stroke-opacity="0.12" stroke-width="1" /><text x="44" y="668" font-size="17" font-weight="600" fill="#293d56"><tspan x="44" dy="0">Risultato MCP remoto</tspan></text><text x="377" y="668" font-size="17" font-weight="400" fill="#293d56"><tspan x="377" dy="0">Contenuto esterno non affidabile</tspan></text><text x="712" y="668" font-size="17" font-weight="400" fill="#293d56"><tspan x="712" dy="0">Non può autorizzare altre azioni</tspan></text></g></svg>
