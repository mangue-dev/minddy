<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img"><title>Two separate feedback flows</title><rect width="1100" height="760" fill="#fafafa" /><g font-family="Inter, Arial, sans-serif" fill="#18181b"><text x="32" y="46" font-size="25" font-weight="600" fill="#293d56"><tspan x="32" dy="0">Two separate feedback flows</tspan></text><text x="32" y="95" font-size="19" font-weight="600" fill="#293d56"><tspan x="32" dy="0">Server-side ingestion</tspan></text><rect x="32" y="116" width="494" height="106" rx="12" fill="#e6edf5" stroke="#293d56" stroke-opacity="0.12" stroke-width="1" /><text x="50" y="148" font-size="18" font-weight="400" fill="#293d56"><tspan x="50" dy="0">Backend keeps the feedback key</tspan></text><path d="M279 223v22m-5-5 5 5 5-5" stroke="#60706b" stroke-width="1.5" fill="none" /><rect x="32" y="246" width="494" height="106" rx="12" fill="#e0efe8" stroke="#1e4436" stroke-opacity="0.12" stroke-width="1" /><text x="50" y="278" font-size="18" font-weight="400" fill="#293d56"><tspan x="50" dy="0">POST /api/v1/feedback with Bearer key and</tspan><tspan x="50" dy="25.2">stable user identity</tspan></text><path d="M279 353v22m-5-5 5 5 5-5" stroke="#60706b" stroke-width="1.5" fill="none" /><rect x="32" y="376" width="494" height="106" rx="12" fill="#f0ecf6" stroke="#433352" stroke-opacity="0.12" stroke-width="1" /><text x="50" y="408" font-size="18" font-weight="400" fill="#293d56"><tspan x="50" dy="0">HTTP 201: saved post in team inbox; board</tspan><tspan x="50" dy="25.2">may be disabled</tspan></text><text x="574" y="95" font-size="19" font-weight="600" fill="#293d56"><tspan x="574" dy="0">Browser visitor SSO</tspan></text><rect x="574" y="116" width="494" height="106" rx="12" fill="#f7ecdf" stroke="#573e28" stroke-opacity="0.12" stroke-width="1" /><text x="592" y="148" font-size="18" font-weight="400" fill="#293d56"><tspan x="592" dy="0">Backend keeps the separate board SSO secret</tspan></text><path d="M821 223v22m-5-5 5 5 5-5" stroke="#60706b" stroke-width="1.5" fill="none" /><rect x="574" y="246" width="494" height="106" rx="12" fill="#e6edf5" stroke="#293d56" stroke-opacity="0.12" stroke-width="1" /><text x="592" y="278" font-size="18" font-weight="400" fill="#293d56"><tspan x="592" dy="0">Sign HS256 JWT with sub, exp and unique</tspan><tspan x="592" dy="25.2">jti; lifetime ≤ 600 s</tspan></text><path d="M821 353v22m-5-5 5 5 5-5" stroke="#60706b" stroke-width="1.5" fill="none" /><rect x="574" y="376" width="494" height="106" rx="12" fill="#e0efe8" stroke="#1e4436" stroke-opacity="0.12" stroke-width="1" /><text x="592" y="408" font-size="18" font-weight="400" fill="#293d56"><tspan x="592" dy="0">Redirect browser to</tspan><tspan x="592" dy="25.2">/f/&lt;board-token&gt;?sso=&lt;jwt&gt;</tspan></text><path d="M821 483v22m-5-5 5 5 5-5" stroke="#60706b" stroke-width="1.5" fill="none" /><rect x="574" y="506" width="494" height="106" rx="12" fill="#f0ecf6" stroke="#433352" stroke-opacity="0.12" stroke-width="1" /><text x="592" y="538" font-size="18" font-weight="400" fill="#293d56"><tspan x="592" dy="0">One-time token creates visitor session;</tspan><tspan x="592" dy="25.2">open My feedback</tspan></text><text x="32" y="688" font-size="17" font-weight="400" fill="#293d56"><tspan x="32" dy="0">Never send the ingestion key or SSO secret to browser code. Clock skew tolerance: 60 s.</tspan></text></g></svg>
