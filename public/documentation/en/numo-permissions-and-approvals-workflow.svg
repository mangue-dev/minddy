<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" role="img"><title>Numo: access and authorization</title><rect width="1100" height="790" fill="#fafafa" /><g font-family="Inter, Arial, sans-serif" fill="#18181b"><text x="32" y="46" font-size="25" font-weight="600" fill="#293d56"><tspan x="32" dy="0">Numo: access and authorization</tspan></text><text x="44" y="94" font-size="17" font-weight="600" fill="#293d56"><tspan x="44" dy="0">Action or context</tspan></text><text x="377" y="94" font-size="17" font-weight="600" fill="#293d56"><tspan x="377" dy="0">Who authorizes it</tspan></text><text x="712" y="94" font-size="17" font-weight="600" fill="#293d56"><tspan x="712" dy="0">Boundary</tspan></text><rect x="32" y="114" width="1036" height="78" rx="12" fill="#e6edf5" stroke="#293d56" stroke-opacity="0.12" stroke-width="1" /><text x="44" y="140" font-size="17" font-weight="600" fill="#293d56"><tspan x="44" dy="0">Project work</tspan></text><text x="377" y="140" font-size="17" font-weight="400" fill="#293d56"><tspan x="377" dy="0">Member with project access</tspan></text><text x="712" y="140" font-size="17" font-weight="400" fill="#293d56"><tspan x="712" dy="0">Existing project permissions</tspan><tspan x="712" dy="23.799999999999997">still apply</tspan></text><rect x="32" y="202" width="1036" height="78" rx="12" fill="#e0efe8" stroke="#1e4436" stroke-opacity="0.12" stroke-width="1" /><text x="44" y="228" font-size="17" font-weight="600" fill="#293d56"><tspan x="44" dy="0">Owner settings</tspan></text><text x="377" y="228" font-size="17" font-weight="400" fill="#293d56"><tspan x="377" dy="0">Project owner</tspan></text><text x="712" y="228" font-size="17" font-weight="400" fill="#293d56"><tspan x="712" dy="0">Membership, repository and</tspan><tspan x="712" dy="23.799999999999997">feedback settings</tspan></text><rect x="32" y="290" width="1036" height="78" rx="12" fill="#f0ecf6" stroke="#433352" stroke-opacity="0.12" stroke-width="1" /><text x="44" y="316" font-size="17" font-weight="600" fill="#293d56"><tspan x="44" dy="0">Credentials and security</tspan></text><text x="377" y="316" font-size="17" font-weight="400" fill="#293d56"><tspan x="377" dy="0">Account holder, in settings</tspan></text><text x="712" y="316" font-size="17" font-weight="400" fill="#293d56"><tspan x="712" dy="0">Configure keys, Git and</tspan><tspan x="712" dy="23.799999999999997">two-factor authentication</tspan><tspan x="712" dy="23.799999999999997">directly</tspan></text><rect x="32" y="378" width="1036" height="78" rx="12" fill="#f7ecdf" stroke="#573e28" stroke-opacity="0.12" stroke-width="1" /><text x="44" y="404" font-size="17" font-weight="600" fill="#293d56"><tspan x="44" dy="0">Public feedback reply</tspan></text><text x="377" y="404" font-size="17" font-weight="400" fill="#293d56"><tspan x="377" dy="0">An explicit user request</tspan></text><text x="712" y="404" font-size="17" font-weight="400" fill="#293d56"><tspan x="712" dy="0">Reading a request does not</tspan><tspan x="712" dy="23.799999999999997">authorize a public reply</tspan></text><rect x="32" y="466" width="1036" height="78" rx="12" fill="#e6edf5" stroke="#293d56" stroke-opacity="0.12" stroke-width="1" /><text x="44" y="492" font-size="17" font-weight="600" fill="#293d56"><tspan x="44" dy="0">Personal MCP</tspan></text><text x="377" y="492" font-size="17" font-weight="400" fill="#293d56"><tspan x="377" dy="0">The conversation caller</tspan></text><text x="712" y="492" font-size="17" font-weight="400" fill="#293d56"><tspan x="712" dy="0">No other member’s personal</tspan><tspan x="712" dy="23.799999999999997">connections</tspan></text><rect x="32" y="554" width="1036" height="78" rx="12" fill="#e0efe8" stroke="#1e4436" stroke-opacity="0.12" stroke-width="1" /><text x="44" y="580" font-size="17" font-weight="600" fill="#293d56"><tspan x="44" dy="0">Scheduled routine</tspan></text><text x="377" y="580" font-size="17" font-weight="400" fill="#293d56"><tspan x="377" dy="0">Current project owner</tspan></text><text x="712" y="580" font-size="17" font-weight="400" fill="#293d56"><tspan x="712" dy="0">Owner’s connections and AI budget</tspan></text><rect x="32" y="642" width="1036" height="78" rx="12" fill="#f0ecf6" stroke="#433352" stroke-opacity="0.12" stroke-width="1" /><text x="44" y="668" font-size="17" font-weight="600" fill="#293d56"><tspan x="44" dy="0">Remote MCP result</tspan></text><text x="377" y="668" font-size="17" font-weight="400" fill="#293d56"><tspan x="377" dy="0">Untrusted service content</tspan></text><text x="712" y="668" font-size="17" font-weight="400" fill="#293d56"><tspan x="712" dy="0">Cannot authorize additional</tspan><tspan x="712" dy="23.799999999999997">actions</tspan></text></g></svg>
