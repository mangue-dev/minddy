<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img"><title>GitHub issue synchronization</title><rect width="1100" height="720" fill="#fafafa" /><g font-family="Inter, Arial, sans-serif" fill="#18181b"><text x="32" y="46" font-size="25" font-weight="600" fill="#293d56"><tspan x="32" dy="0">GitHub issue synchronization</tspan></text><rect x="32" y="86" width="1036" height="106" rx="12" fill="#e6edf5" stroke="#293d56" stroke-opacity="0.12" stroke-width="1" /><text x="50" y="115" font-size="19" font-weight="600" fill="#293d56"><tspan x="50" dy="0">1. Owner setup</tspan></text><text x="50" y="146" font-size="17" font-weight="400" fill="#293d56"><tspan x="50" dy="0">Link repository, grant Issues read/write and enable issue synchronization.</tspan></text><path d="M550 193v14m-5-5 5 5 5-5" stroke="#60706b" stroke-width="1.5" fill="none" /><rect x="32" y="212" width="1036" height="106" rx="12" fill="#e0efe8" stroke="#1e4436" stroke-opacity="0.12" stroke-width="1" /><text x="50" y="241" font-size="19" font-weight="600" fill="#293d56"><tspan x="50" dy="0">2. Incoming events</tspan></text><text x="50" y="272" font-size="17" font-weight="400" fill="#293d56"><tspan x="50" dy="0">Deduplicate delivery IDs; reject payloads older than newer local edits.</tspan></text><path d="M550 319v14m-5-5 5 5 5-5" stroke="#60706b" stroke-width="1.5" fill="none" /><rect x="32" y="338" width="1036" height="106" rx="12" fill="#f0ecf6" stroke="#433352" stroke-opacity="0.12" stroke-width="1" /><text x="50" y="367" font-size="19" font-weight="600" fill="#293d56"><tspan x="50" dy="0">3. Import and mapping</tspan></text><text x="50" y="398" font-size="17" font-weight="400" fill="#293d56"><tspan x="50" dy="0">Imported issues enter triage. Title/body become title/description; labels supply categories and</tspan><tspan x="50" dy="23.799999999999997">recognized priority/effort.</tspan></text><path d="M550 445v14m-5-5 5 5 5-5" stroke="#60706b" stroke-width="1.5" fill="none" /><rect x="32" y="464" width="1036" height="106" rx="12" fill="#f7ecdf" stroke="#573e28" stroke-opacity="0.12" stroke-width="1" /><text x="50" y="493" font-size="19" font-weight="600" fill="#293d56"><tspan x="50" dy="0">4. State mirroring</tspan></text><text x="50" y="524" font-size="17" font-weight="400" fill="#293d56"><tspan x="50" dy="0">Open and closed states mirror in both directions. Compare timestamps when changes compete.</tspan></text><text x="32" y="633" font-size="17" font-weight="400" fill="#293d56"><tspan x="32" dy="0">Comments retain remote identity; repeated comments do not duplicate. GitLab field mappings may differ.</tspan></text></g></svg>
