<svg xmlns="http://www.w3.org/2000/svg" width="816" height="390" viewBox="0 0 816 390" role="img" aria-labelledby="title desc">
<title id="title">Providers, usages and Numo</title><desc id="desc">Connected providers, a provider for each usage, and Numo's provider and model are separate settings.</desc>
<rect width="816" height="390" rx="16" fill="#f8fafc"/>
<text x="32" y="38" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Providers, usages and Numo</text>
<rect x="24" y="56" width="768" height="94" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="42" y="83" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">1. Connected providers</text>
<text x="42" y="107" font-family="Arial,sans-serif" font-size="14" fill="#475569">minddy Cloud and your API keys stay available side by side.</text>
<rect x="24" y="161" width="768" height="94" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="42" y="188" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">2. A provider per usage</text>
<text x="42" y="212" font-family="Arial,sans-serif" font-size="14" fill="#475569">Numo, automations, dictation and feedback each choose their provider.</text>
<rect x="24" y="266" width="768" height="94" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="42" y="293" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">3. Numo provider and model</text>
<text x="42" y="317" font-family="Arial,sans-serif" font-size="14" fill="#475569">Pick a provider, then its model. A conversation can choose its own.</text>
</svg>
