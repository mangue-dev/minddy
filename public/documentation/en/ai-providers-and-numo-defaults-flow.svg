<svg xmlns="http://www.w3.org/2000/svg" width="816" height="390" viewBox="0 0 816 390" role="img" aria-labelledby="title desc">
<title id="title">Providers and Numo defaults</title><desc id="desc">Connected providers, capability routing and a personal Numo model are separate settings.</desc>
<rect width="816" height="390" rx="16" fill="#f8fafc"/>
<text x="32" y="38" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Providers and Numo defaults</text>
<rect x="24" y="56" width="768" height="94" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="42" y="83" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">1. Connected providers</text>
<text x="42" y="107" font-family="Arial,sans-serif" font-size="14" fill="#475569">Keep several API providers connected; adding one preserves the others.</text>
<rect x="24" y="161" width="768" height="94" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="42" y="188" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">2. Provider by capability</text>
<text x="42" y="212" font-family="Arial,sans-serif" font-size="14" fill="#475569">Assign text, transcription and embeddings independently, then enable the required usages.</text>
<rect x="24" y="266" width="768" height="94" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="42" y="293" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">3. Default Numo model</text>
<text x="42" y="317" font-family="Arial,sans-serif" font-size="14" fill="#475569">Follow the app default or save a personal model. A conversation choice takes precedence.</text>
</svg>
