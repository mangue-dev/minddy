<text x="98" y="543" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Revoke link; issued file URLs expire</text>
<text x="98" y="577" font-family="Arial, sans-serif" font-size="29" fill="#293d56">later</text>
</svg>
