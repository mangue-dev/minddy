<circle cx="60" cy="88" r="5" fill="#ffffff" />
<text x="98" y="98" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Account and project permission checks</text>
<rect x="24" y="178" width="672" height="128" rx="16" fill="#e0efe8" stroke="#1e4436" stroke-width="1" stroke-opacity="0.12" />
<circle cx="60" cy="242" r="20" fill="#60706b" />
<circle cx="60" cy="242" r="5" fill="#ffffff" />
<text x="98" y="252" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Private object or explicit publication</text>
