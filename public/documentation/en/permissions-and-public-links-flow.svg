<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc">
<title id="title">Understand permissions and public links</title>
<desc id="desc">Diagram: Account and project permission checks. Private object or explicit publication. Published set only; signed file access. Revoke link; issued file URLs expire later.</desc>
<rect width="720" height="640" rx="20" fill="#fafaf9"/>
<rect x="24" y="24" width="672" height="128" rx="16" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/>
<circle cx="60" cy="88" r="20" fill="#0f766e"/>
<circle cx="60" cy="88" r="5" fill="#ffffff"/>
<text x="98" y="98" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">Account and project permission checks</text>
<rect x="24" y="178" width="672" height="128" rx="16" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/>
<circle cx="60" cy="242" r="20" fill="#0f766e"/>
<circle cx="60" cy="242" r="5" fill="#ffffff"/>
<text x="98" y="252" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">Private object or explicit publication</text>
<rect x="24" y="332" width="672" height="128" rx="16" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/>
<circle cx="60" cy="396" r="20" fill="#0f766e"/>
<circle cx="60" cy="396" r="5" fill="#ffffff"/>
<text x="98" y="406" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">Published set only; signed file access</text>
<rect x="24" y="486" width="672" height="128" rx="16" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/>
<circle cx="60" cy="550" r="20" fill="#0f766e"/>
<circle cx="60" cy="550" r="5" fill="#ffffff"/>
<text x="98" y="543" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">Revoke link; issued file URLs expire</text>
<text x="98" y="577" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">later</text>
</svg>
