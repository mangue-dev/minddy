<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc">
<title id="title">Understand durable Numo turns and delegated work</title>
<desc id="desc">Diagram: Persist the intent, message and request UUID. Claim turn, checkpoint tools and their outcomes. Wait for current code worker when needed. Replay durable events; reconcile uncertain writes.</desc>
<rect width="720" height="640" rx="20" fill="#fafaf9" />
<rect x="24" y="24" width="672" height="128" rx="16" fill="#e6edf5" stroke="#293d56" stroke-width="1" stroke-opacity="0.12" />
<circle cx="60" cy="88" r="20" fill="#60706b" />
<text x="60" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">1</text>
<text x="98" y="81" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Persist the intent, message and</text>
<text x="98" y="115" font-family="Arial, sans-serif" font-size="29" fill="#293d56">request UUID</text>
<path d="M360 156v16m-7-5 7 7 7-7" fill="none" stroke="#60706b" stroke-width="1.5" />
<rect x="24" y="178" width="672" height="128" rx="16" fill="#e0efe8" stroke="#1e4436" stroke-width="1" stroke-opacity="0.12" />
<circle cx="60" cy="242" r="20" fill="#60706b" />
<text x="60" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">2</text>
<text x="98" y="235" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Claim turn, checkpoint tools and their</text>
<text x="98" y="269" font-family="Arial, sans-serif" font-size="29" fill="#293d56">outcomes</text>
<path d="M360 310v16m-7-5 7 7 7-7" fill="none" stroke="#60706b" stroke-width="1.5" />
<rect x="24" y="332" width="672" height="128" rx="16" fill="#f0ecf6" stroke="#433352" stroke-width="1" stroke-opacity="0.12" />
<circle cx="60" cy="396" r="20" fill="#60706b" />
<text x="60" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">3</text>
<text x="98" y="389" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Wait for current code worker when</text>
<text x="98" y="423" font-family="Arial, sans-serif" font-size="29" fill="#293d56">needed</text>
<path d="M360 464v16m-7-5 7 7 7-7" fill="none" stroke="#60706b" stroke-width="1.5" />
