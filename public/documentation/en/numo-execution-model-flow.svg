<circle cx="60" cy="550" r="20" fill="#60706b" />
<text x="60" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">4</text>
<text x="98" y="543" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Replay durable events; reconcile</text>
<text x="98" y="577" font-family="Arial, sans-serif" font-size="29" fill="#293d56">uncertain writes</text>
</svg>
