<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc">
<title id="title">Update an instance without losing recovery</title>
<desc id="desc">Diagram: Stop writes and scheduled work. Seal a complete pre-update backup. Target migrations, then target application. Verify recovery and reopen access.</desc>
<rect width="720" height="640" rx="20" fill="#fafaf9"/>
<rect x="24" y="24" width="672" height="128" rx="16" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/>
<circle cx="60" cy="88" r="20" fill="#0f766e"/>
<text x="60" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">1</text>
<text x="98" y="98" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">Stop writes and scheduled work</text>
<path d="M360 156v16m-7-5 7 7 7-7" fill="none" stroke="#0f766e" stroke-width="3"/>
<rect x="24" y="178" width="672" height="128" rx="16" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/>
<circle cx="60" cy="242" r="20" fill="#0f766e"/>
<text x="60" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">2</text>
<text x="98" y="252" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">Seal a complete pre-update backup</text>
<path d="M360 310v16m-7-5 7 7 7-7" fill="none" stroke="#0f766e" stroke-width="3"/>
<rect x="24" y="332" width="672" height="128" rx="16" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/>
<circle cx="60" cy="396" r="20" fill="#0f766e"/>
<text x="60" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">3</text>
<text x="98" y="389" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">Target migrations, then target</text>
<text x="98" y="423" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">application</text>
<path d="M360 464v16m-7-5 7 7 7-7" fill="none" stroke="#0f766e" stroke-width="3"/>
<rect x="24" y="486" width="672" height="128" rx="16" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/>
<circle cx="60" cy="550" r="20" fill="#0f766e"/>
<text x="60" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">4</text>
<text x="98" y="560" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">Verify recovery and reopen access</text>
</svg>
