<title id="title">Créer tickets ou feedback et recevoir des webhooks signés</title>
<desc id="desc">Schéma: Le serveur garde la clé d’intégration projet. POST tickets ou feedback avec le bon type. Le propriétaire choisit la destination webhook. Réception : HMAC brut et UUID de livraison.</desc>
