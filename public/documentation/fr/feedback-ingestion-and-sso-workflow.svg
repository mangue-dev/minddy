<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img"><title>Deux parcours de retours distincts</title><rect width="1100" height="760" fill="#fafafa"/><g font-family="Inter, Arial, sans-serif" fill="#18181b"><text x="32" y="46" font-size="25" font-weight="600"><tspan x="32" dy="0">Deux parcours de retours distincts</tspan></text><text x="32" y="95" font-size="19" font-weight="600"><tspan x="32" dy="0">Ingestion côté serveur</tspan></text><rect x="32" y="116" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="50" y="148" font-size="18" font-weight="400"><tspan x="50" dy="0">Le backend garde la clé de retours</tspan></text><path d="M279 223v22m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="32" y="246" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="50" y="278" font-size="18" font-weight="400"><tspan x="50" dy="0">POST /api/v1/feedback avec clé Bearer et</tspan><tspan x="50" dy="25.2">identité stable</tspan></text><path d="M279 353v22m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="32" y="376" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="50" y="408" font-size="18" font-weight="400"><tspan x="50" dy="0">HTTP 201 : retour enregistré dans la boîte</tspan><tspan x="50" dy="25.2">équipe ; tableau désactivé possible</tspan></text><text x="574" y="95" font-size="19" font-weight="600"><tspan x="574" dy="0">SSO du visiteur navigateur</tspan></text><rect x="574" y="116" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="592" y="148" font-size="18" font-weight="400"><tspan x="592" dy="0">Le backend garde le secret SSO séparé du</tspan><tspan x="592" dy="25.2">tableau</tspan></text><path d="M821 223v22m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="574" y="246" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="592" y="278" font-size="18" font-weight="400"><tspan x="592" dy="0">Signer JWT HS256 : sub, exp, jti unique ;</tspan><tspan x="592" dy="25.2">validité ≤ 600 s</tspan></text><path d="M821 353v22m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="574" y="376" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="592" y="408" font-size="18" font-weight="400"><tspan x="592" dy="0">Rediriger le navigateur vers</tspan><tspan x="592" dy="25.2">/f/&lt;board-token&gt;?sso=&lt;jwt&gt;</tspan></text><path d="M821 483v22m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="574" y="506" width="494" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="592" y="538" font-size="18" font-weight="400"><tspan x="592" dy="0">Le jeton à usage unique crée la session ;</tspan><tspan x="592" dy="25.2">ouvrir Mes retours</tspan></text><text x="32" y="688" font-size="17" font-weight="400"><tspan x="32" dy="0">Ne jamais envoyer clé d’ingestion ou secret SSO au code navigateur. Tolérance d’horloge : 60 s.</tspan></text></g></svg>