<svg xmlns="http://www.w3.org/2000/svg" width="816" height="390" viewBox="0 0 816 390" role="img" aria-labelledby="title desc">
<title id="title">Fournisseurs, usages et Numo</title><desc id="desc">Les fournisseurs connectés, un fournisseur par usage, ainsi que le fournisseur et le modèle de Numo sont des réglages distincts.</desc>
<rect width="816" height="390" rx="16" fill="#f8fafc"/>
<text x="32" y="38" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Fournisseurs, usages et Numo</text>
<rect x="24" y="56" width="768" height="94" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="42" y="83" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">1. Fournisseurs connectés</text>
<text x="42" y="107" font-family="Arial,sans-serif" font-size="14" fill="#475569">minddy Cloud et vos clés API restent disponibles côte à côte.</text>
<rect x="24" y="161" width="768" height="94" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="42" y="188" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">2. Un fournisseur par usage</text>
<text x="42" y="212" font-family="Arial,sans-serif" font-size="14" fill="#475569">Chaque usage précis, des titres de Numo à la transcription, choisit son fournisseur.</text>
<rect x="24" y="266" width="768" height="94" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="42" y="293" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">3. Fournisseur et modèle de Numo</text>
<text x="42" y="317" font-family="Arial,sans-serif" font-size="14" fill="#475569">Choisissez un fournisseur, puis son modèle. Une conversation peut choisir les siens.</text>
</svg>
