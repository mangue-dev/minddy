<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" role="img"><title>Numo : accès et autorisation</title><rect width="1100" height="790" fill="#fafafa"/><g font-family="Inter, Arial, sans-serif" fill="#18181b"><text x="32" y="46" font-size="25" font-weight="600"><tspan x="32" dy="0">Numo : accès et autorisation</tspan></text><text x="44" y="94" font-size="17" font-weight="600"><tspan x="44" dy="0">Action ou contexte</tspan></text><text x="377" y="94" font-size="17" font-weight="600"><tspan x="377" dy="0">Qui autorise</tspan></text><text x="712" y="94" font-size="17" font-weight="600"><tspan x="712" dy="0">Limite</tspan></text><rect x="32" y="114" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="140" font-size="17" font-weight="600"><tspan x="44" dy="0">Travail du projet</tspan></text><text x="377" y="140" font-size="17" font-weight="400"><tspan x="377" dy="0">Membre ayant accès au projet</tspan></text><text x="712" y="140" font-size="17" font-weight="400"><tspan x="712" dy="0">Les permissions du projet restent</tspan><tspan x="712" dy="23.799999999999997">applicables</tspan></text><rect x="32" y="202" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="228" font-size="17" font-weight="600"><tspan x="44" dy="0">Réglages du propriétaire</tspan></text><text x="377" y="228" font-size="17" font-weight="400"><tspan x="377" dy="0">Propriétaire du projet</tspan></text><text x="712" y="228" font-size="17" font-weight="400"><tspan x="712" dy="0">Membres, repository et réglages</tspan><tspan x="712" dy="23.799999999999997">des retours</tspan></text><rect x="32" y="290" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="316" font-size="17" font-weight="600"><tspan x="44" dy="0">Identifiants et sécurité</tspan></text><text x="377" y="316" font-size="17" font-weight="400"><tspan x="377" dy="0">Titulaire du compte, dans les</tspan><tspan x="377" dy="23.799999999999997">réglages</tspan></text><text x="712" y="316" font-size="17" font-weight="400"><tspan x="712" dy="0">Configurer directement clés, Git</tspan><tspan x="712" dy="23.799999999999997">et double authentification</tspan></text><rect x="32" y="378" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="404" font-size="17" font-weight="600"><tspan x="44" dy="0">Réponse publique à un retour</tspan></text><text x="377" y="404" font-size="17" font-weight="400"><tspan x="377" dy="0">Demande explicite de</tspan><tspan x="377" dy="23.799999999999997">l’utilisateur</tspan></text><text x="712" y="404" font-size="17" font-weight="400"><tspan x="712" dy="0">Lire une demande n’autorise pas</tspan><tspan x="712" dy="23.799999999999997">une réponse publique</tspan></text><rect x="32" y="466" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="492" font-size="17" font-weight="600"><tspan x="44" dy="0">MCP personnel</tspan></text><text x="377" y="492" font-size="17" font-weight="400"><tspan x="377" dy="0">Auteur de la conversation</tspan></text><text x="712" y="492" font-size="17" font-weight="400"><tspan x="712" dy="0">Pas de connexions personnelles</tspan><tspan x="712" dy="23.799999999999997">d’un autre membre</tspan></text><rect x="32" y="554" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="580" font-size="17" font-weight="600"><tspan x="44" dy="0">Routine planifiée</tspan></text><text x="377" y="580" font-size="17" font-weight="400"><tspan x="377" dy="0">Propriétaire actuel du projet</tspan></text><text x="712" y="580" font-size="17" font-weight="400"><tspan x="712" dy="0">Connexions et budget IA du</tspan><tspan x="712" dy="23.799999999999997">propriétaire</tspan></text><rect x="32" y="642" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="668" font-size="17" font-weight="600"><tspan x="44" dy="0">Résultat MCP distant</tspan></text><text x="377" y="668" font-size="17" font-weight="400"><tspan x="377" dy="0">Contenu externe non fiable</tspan></text><text x="712" y="668" font-size="17" font-weight="400"><tspan x="712" dy="0">Ne peut pas autoriser des actions</tspan><tspan x="712" dy="23.799999999999997">supplémentaires</tspan></text></g></svg>