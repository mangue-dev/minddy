<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img"><title>Synchronisation des tickets GitHub</title><rect width="1100" height="720" fill="#fafafa"/><g font-family="Inter, Arial, sans-serif" fill="#18181b"><text x="32" y="46" font-size="25" font-weight="600"><tspan x="32" dy="0">Synchronisation des tickets GitHub</tspan></text><rect x="32" y="86" width="1036" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="50" y="115" font-size="19" font-weight="600"><tspan x="50" dy="0">1. Configuration du propriétaire</tspan></text><text x="50" y="146" font-size="17" font-weight="400"><tspan x="50" dy="0">Relier le repository, autoriser la lecture/écriture Issues et activer la synchronisation.</tspan></text><path d="M550 193v14m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="32" y="212" width="1036" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="50" y="241" font-size="19" font-weight="600"><tspan x="50" dy="0">2. Événements entrants</tspan></text><text x="50" y="272" font-size="17" font-weight="400"><tspan x="50" dy="0">Dédupliquer les identifiants de livraison ; rejeter les données plus anciennes que les modifications</tspan><tspan x="50" dy="23.799999999999997">locales.</tspan></text><path d="M550 319v14m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="32" y="338" width="1036" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="50" y="367" font-size="19" font-weight="600"><tspan x="50" dy="0">3. Import et correspondances</tspan></text><text x="50" y="398" font-size="17" font-weight="400"><tspan x="50" dy="0">Les tickets importés entrent au triage. Titre/corps deviennent titre/description ; les labels donnent</tspan><tspan x="50" dy="23.799999999999997">catégories, priorité et effort reconnus.</tspan></text><path d="M550 445v14m-5-5 5 5 5-5" stroke="#71717a" stroke-width="2" fill="none"/><rect x="32" y="464" width="1036" height="106" rx="12" fill="white" stroke="#d4d4d8"/><text x="50" y="493" font-size="19" font-weight="600"><tspan x="50" dy="0">4. États synchronisés</tspan></text><text x="50" y="524" font-size="17" font-weight="400"><tspan x="50" dy="0">Les états ouvert et fermé se synchronisent dans les deux sens. Comparer les horodatages en cas de</tspan><tspan x="50" dy="23.799999999999997">modifications concurrentes.</tspan></text><text x="32" y="633" font-size="17" font-weight="400"><tspan x="32" dy="0">Les commentaires gardent l’identité distante sans duplication. Les correspondances GitLab peuvent différer.</tspan></text></g></svg>