<text x="48" y="235" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Origines application et Supabase</text>
<text x="48" y="269" font-family="Arial, sans-serif" font-size="29" fill="#293d56">public</text>
<rect x="24" y="332" width="672" height="128" rx="16" fill="#f0ecf6" stroke="#433352" stroke-width="1" stroke-opacity="0.12" />
