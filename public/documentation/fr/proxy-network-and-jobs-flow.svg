<title id="title">Exposer les origines publiques et exécuter les tâches planifiées</title>
<desc id="desc">Schéma: Proxy HTTPS public. Origines application et Supabase public. Runner, base et ports internes privés. Jobs authentifiés, arrêtés en maintenance.</desc>
