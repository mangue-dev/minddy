<text x="98" y="81" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">Sauvegarde complète hors serveur</text>
<text x="98" y="115" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">vérifiée</text>
<path d="M360 156v16m-7-5 7 7 7-7" fill="none" stroke="#0f766e" stroke-width="3"/>
