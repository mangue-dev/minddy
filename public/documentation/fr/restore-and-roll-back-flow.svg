<text x="98" y="235" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">Cible vierge isolée et versions</text>
<text x="98" y="269" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">correspondantes</text>
<path d="M360 310v16m-7-5 7 7 7-7" fill="none" stroke="#0f766e" stroke-width="3"/>
<rect x="24" y="332" width="672" height="128" rx="16" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/>
<circle cx="60" cy="396" r="20" fill="#0f766e"/>
<text x="60" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">3</text>
<text x="98" y="389" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">Restaurer ensemble base, octets et</text>
<text x="98" y="423" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">clés</text>
