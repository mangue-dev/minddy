<text x="60" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">4</text>
<text x="98" y="543" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">Vérifier compte, contenu et fichiers</text>
<text x="98" y="577" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">avant ouverture</text>
