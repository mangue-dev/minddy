<circle cx="60" cy="396" r="20" fill="#0f766e"/>
<text x="60" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">3</text>
<text x="98" y="389" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">Proprietário escolhe destino do</text>
<text x="98" y="423" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">webhook</text>
