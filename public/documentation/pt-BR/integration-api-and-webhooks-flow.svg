<text x="98" y="98" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">Servidor mantém chave da integração</text>
<path d="M360 156v16m-7-5 7 7 7-7" fill="none" stroke="#0f766e" stroke-width="3"/>
<rect x="24" y="178" width="672" height="128" rx="16" fill="#ffffff" stroke="#a8a29e" stroke-width="2"/>
<circle cx="60" cy="242" r="20" fill="#0f766e"/>
<text x="60" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">2</text>
<text x="98" y="235" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">POST issues ou feedback com tipo</text>
<text x="98" y="269" font-family="Arial, sans-serif" font-size="29" fill="#1c1917">correto</text>
<path d="M360 310v16m-7-5 7 7 7-7" fill="none" stroke="#0f766e" stroke-width="3"/>
