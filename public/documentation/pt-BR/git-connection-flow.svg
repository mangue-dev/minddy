<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580" role="img"><title>Conectar uma conta e vincular um repositório</title><rect width="720" height="580" rx="20" fill="#fafaf9"/><rect x="24" y="24" width="672" height="152" rx="16" fill="#e6edf5"/><g font-family="Arial, sans-serif" fill="#293d56"><text x="48" y="60" font-size="22" font-weight="600">1. Conta pessoal do Git</text><text x="48" y="99" font-size="20">Autorize o GitHub ou o GitLab para os repositórios de que</text><text x="48" y="125" font-size="20">você precisa.</text></g><path d="M360 181v16m-5-5 5 5 5-5" fill="none" stroke="#60706b"/><rect x="24" y="204" width="672" height="152" rx="16" fill="#e0efe8"/><g font-family="Arial, sans-serif" fill="#1e4436"><text x="48" y="240" font-size="22" font-weight="600">2. Proprietário do projeto</text><text x="48" y="279" font-size="20">Escolha um repositório disponível nas configurações de Git</text><text x="48" y="305" font-size="20">do projeto.</text></g><path d="M360 361v16m-5-5 5 5 5-5" fill="none" stroke="#60706b"/><rect x="24" y="384" width="672" height="152" rx="16" fill="#f0ecf6"/><g font-family="Arial, sans-serif" fill="#433352"><text x="48" y="420" font-size="22" font-weight="600">3. Repositório vinculado</text><text x="48" y="459" font-size="20">Aurora → aurora/web. A sincronização de tickets é uma</text><text x="48" y="485" font-size="20">escolha separada.</text></g></svg>
