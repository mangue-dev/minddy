<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img"><title>Sincronização de tickets do GitHub</title><rect width="1100" height="720" fill="#fafafa" /><g font-family="Inter, Arial, sans-serif" fill="#18181b"><text x="32" y="46" font-size="25" font-weight="600" fill="#293d56"><tspan x="32" dy="0">Sincronização de tickets do GitHub</tspan></text><rect x="32" y="86" width="1036" height="106" rx="12" fill="#e6edf5" stroke="#293d56" stroke-opacity="0.12" stroke-width="1" /><text x="50" y="115" font-size="19" font-weight="600" fill="#293d56"><tspan x="50" dy="0">1. Configuração do proprietário</tspan></text><text x="50" y="146" font-size="17" font-weight="400" fill="#293d56"><tspan x="50" dy="0">Vincular repositório, conceder leitura/escrita de Issues e ativar a sincronização.</tspan></text><path d="M550 193v14m-5-5 5 5 5-5" stroke="#60706b" stroke-width="1.5" fill="none" /><rect x="32" y="212" width="1036" height="106" rx="12" fill="#e0efe8" stroke="#1e4436" stroke-opacity="0.12" stroke-width="1" /><text x="50" y="241" font-size="19" font-weight="600" fill="#293d56"><tspan x="50" dy="0">2. Eventos recebidos</tspan></text><text x="50" y="272" font-size="17" font-weight="400" fill="#293d56"><tspan x="50" dy="0">Deduplicar IDs de entrega; dados mais antigos não sobrescrevem alterações locais mais recentes.</tspan></text><path d="M550 319v14m-5-5 5 5 5-5" stroke="#60706b" stroke-width="1.5" fill="none" /><rect x="32" y="338" width="1036" height="106" rx="12" fill="#f0ecf6" stroke="#433352" stroke-opacity="0.12" stroke-width="1" /><text x="50" y="367" font-size="19" font-weight="600" fill="#293d56"><tspan x="50" dy="0">3. Importação e mapeamento</tspan></text><text x="50" y="398" font-size="17" font-weight="400" fill="#293d56"><tspan x="50" dy="0">Tickets importados entram na triagem. Título/corpo viram título/descrição; rótulos fornecem categorias,</tspan><tspan x="50" dy="23.799999999999997">prioridade e esforço reconhecidos.</tspan></text><path d="M550 445v14m-5-5 5 5 5-5" stroke="#60706b" stroke-width="1.5" fill="none" /><rect x="32" y="464" width="1036" height="106" rx="12" fill="#f7ecdf" stroke="#573e28" stroke-opacity="0.12" stroke-width="1" /><text x="50" y="493" font-size="19" font-weight="600" fill="#293d56"><tspan x="50" dy="0">4. Sincronização de estado</tspan></text><text x="50" y="524" font-size="17" font-weight="400" fill="#293d56"><tspan x="50" dy="0">Estados aberto/fechado são espelhados nos dois sentidos. Comparar horários quando alterações concorrem.</tspan></text><text x="32" y="633" font-size="17" font-weight="400" fill="#293d56"><tspan x="32" dy="0">Comentários mantêm a identidade remota sem duplicação. O mapeamento do GitLab pode ser diferente.</tspan></text></g></svg>
