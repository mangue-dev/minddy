<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" role="img"><title>Numo: acesso e autorização</title><rect width="1100" height="790" fill="#fafafa"/><g font-family="Inter, Arial, sans-serif" fill="#18181b"><text x="32" y="46" font-size="25" font-weight="600"><tspan x="32" dy="0">Numo: acesso e autorização</tspan></text><text x="44" y="94" font-size="17" font-weight="600"><tspan x="44" dy="0">Ação ou contexto</tspan></text><text x="377" y="94" font-size="17" font-weight="600"><tspan x="377" dy="0">Quem autoriza</tspan></text><text x="712" y="94" font-size="17" font-weight="600"><tspan x="712" dy="0">Limite</tspan></text><rect x="32" y="114" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="140" font-size="17" font-weight="600"><tspan x="44" dy="0">Trabalho do projeto</tspan></text><text x="377" y="140" font-size="17" font-weight="400"><tspan x="377" dy="0">Membro com acesso ao projeto</tspan></text><text x="712" y="140" font-size="17" font-weight="400"><tspan x="712" dy="0">As permissões existentes do</tspan><tspan x="712" dy="23.799999999999997">projeto continuam válidas</tspan></text><rect x="32" y="202" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="228" font-size="17" font-weight="600"><tspan x="44" dy="0">Configurações do proprietário</tspan></text><text x="377" y="228" font-size="17" font-weight="400"><tspan x="377" dy="0">Proprietário do projeto</tspan></text><text x="712" y="228" font-size="17" font-weight="400"><tspan x="712" dy="0">Membros, repositório e</tspan><tspan x="712" dy="23.799999999999997">configurações de feedback</tspan></text><rect x="32" y="290" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="316" font-size="17" font-weight="600"><tspan x="44" dy="0">Credenciais e segurança</tspan></text><text x="377" y="316" font-size="17" font-weight="400"><tspan x="377" dy="0">Titular da conta, nas</tspan><tspan x="377" dy="23.799999999999997">configurações</tspan></text><text x="712" y="316" font-size="17" font-weight="400"><tspan x="712" dy="0">Configurar chaves, Git e segundo</tspan><tspan x="712" dy="23.799999999999997">fator diretamente</tspan></text><rect x="32" y="378" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="404" font-size="17" font-weight="600"><tspan x="44" dy="0">Resposta pública ao feedback</tspan></text><text x="377" y="404" font-size="17" font-weight="400"><tspan x="377" dy="0">Pedido explícito do usuário</tspan></text><text x="712" y="404" font-size="17" font-weight="400"><tspan x="712" dy="0">Ler uma solicitação não autoriza</tspan><tspan x="712" dy="23.799999999999997">uma resposta pública</tspan></text><rect x="32" y="466" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="492" font-size="17" font-weight="600"><tspan x="44" dy="0">MCP pessoal</tspan></text><text x="377" y="492" font-size="17" font-weight="400"><tspan x="377" dy="0">Autor da conversa</tspan></text><text x="712" y="492" font-size="17" font-weight="400"><tspan x="712" dy="0">Sem conexões pessoais de outros</tspan><tspan x="712" dy="23.799999999999997">membros</tspan></text><rect x="32" y="554" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="580" font-size="17" font-weight="600"><tspan x="44" dy="0">Rotina agendada</tspan></text><text x="377" y="580" font-size="17" font-weight="400"><tspan x="377" dy="0">Proprietário atual do projeto</tspan></text><text x="712" y="580" font-size="17" font-weight="400"><tspan x="712" dy="0">Conexões e orçamento de IA do</tspan><tspan x="712" dy="23.799999999999997">proprietário</tspan></text><rect x="32" y="642" width="1036" height="78" rx="12" fill="white" stroke="#d4d4d8"/><text x="44" y="668" font-size="17" font-weight="600"><tspan x="44" dy="0">Resultado MCP remoto</tspan></text><text x="377" y="668" font-size="17" font-weight="400"><tspan x="377" dy="0">Conteúdo externo não confiável</tspan></text><text x="712" y="668" font-size="17" font-weight="400"><tspan x="712" dy="0">Não pode autorizar ações</tspan><tspan x="712" dy="23.799999999999997">adicionais</tspan></text></g></svg>