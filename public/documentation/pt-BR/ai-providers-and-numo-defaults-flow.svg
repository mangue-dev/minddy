<svg xmlns="http://www.w3.org/2000/svg" width="816" height="390" viewBox="0 0 816 390" role="img" aria-labelledby="title desc">
<title id="title">Provedores, usos e Numo</title><desc id="desc">Provedores conectados, um provedor por uso e o provedor e modelo do Numo são ajustes separados.</desc>
<rect width="816" height="390" rx="16" fill="#f8fafc"/>
<text x="32" y="38" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Provedores, usos e Numo</text>
<rect x="24" y="56" width="768" height="94" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="42" y="83" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">1. Provedores conectados</text>
<text x="42" y="107" font-family="Arial,sans-serif" font-size="14" fill="#475569">O minddy Cloud e suas chaves de API ficam disponíveis lado a lado.</text>
<rect x="24" y="161" width="768" height="94" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="42" y="188" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">2. Um provedor por uso</text>
<text x="42" y="212" font-family="Arial,sans-serif" font-size="14" fill="#475569">Cada uso específico, dos títulos do Numo à transcrição, escolhe o seu provedor.</text>
<rect x="24" y="266" width="768" height="94" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="42" y="293" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#0f172a">3. Provedor e modelo do Numo</text>
<text x="42" y="317" font-family="Arial,sans-serif" font-size="14" fill="#475569">Escolha um provedor e depois o modelo. Uma conversa pode escolher os seus.</text>
</svg>
