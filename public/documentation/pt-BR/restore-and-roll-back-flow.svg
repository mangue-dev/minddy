<text x="60" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">3</text>
<text x="98" y="406" font-family="Arial, sans-serif" font-size="29" fill="#293d56">Restaurar banco, bytes e chaves juntos</text>
