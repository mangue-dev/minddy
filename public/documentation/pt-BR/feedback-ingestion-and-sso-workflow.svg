<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img"><title>Dois fluxos de feedback separados</title><rect width="1100" height="760" fill="#fafafa" /><g font-family="Inter, Arial, sans-serif" fill="#18181b"><text x="32" y="46" font-size="25" font-weight="600" fill="#293d56"><tspan x="32" dy="0">Dois fluxos de feedback separados</tspan></text><text x="32" y="95" font-size="19" font-weight="600" fill="#293d56"><tspan x="32" dy="0">Ingestão pelo servidor</tspan></text><rect x="32" y="116" width="494" height="106" rx="12" fill="#e6edf5" stroke="#293d56" stroke-opacity="0.12" stroke-width="1" /><text x="50" y="148" font-size="18" font-weight="400" fill="#293d56"><tspan x="50" dy="0">O backend guarda a chave de feedback</tspan></text><path d="M279 223v22m-5-5 5 5 5-5" stroke="#60706b" stroke-width="1.5" fill="none" /><rect x="32" y="246" width="494" height="106" rx="12" fill="#e0efe8" stroke="#1e4436" stroke-opacity="0.12" stroke-width="1" /><text x="50" y="278" font-size="18" font-weight="400" fill="#293d56"><tspan x="50" dy="0">POST /api/v1/feedback com chave Bearer e</tspan><tspan x="50" dy="25.2">identidade estável</tspan></text><path d="M279 353v22m-5-5 5 5 5-5" stroke="#60706b" stroke-width="1.5" fill="none" /><rect x="32" y="376" width="494" height="106" rx="12" fill="#f0ecf6" stroke="#433352" stroke-opacity="0.12" stroke-width="1" /><text x="50" y="408" font-size="18" font-weight="400" fill="#293d56"><tspan x="50" dy="0">HTTP 201: post salvo na caixa da equipe; o</tspan><tspan x="50" dy="25.2">quadro pode estar desativado</tspan></text><text x="574" y="95" font-size="19" font-weight="600" fill="#293d56"><tspan x="574" dy="0">SSO do visitante no navegador</tspan></text><rect x="574" y="116" width="494" height="106" rx="12" fill="#f7ecdf" stroke="#573e28" stroke-opacity="0.12" stroke-width="1" /><text x="592" y="148" font-size="18" font-weight="400" fill="#293d56"><tspan x="592" dy="0">O backend guarda o segredo SSO separado do</tspan><tspan x="592" dy="25.2">quadro</tspan></text><path d="M821 223v22m-5-5 5 5 5-5" stroke="#60706b" stroke-width="1.5" fill="none" /><rect x="574" y="246" width="494" height="106" rx="12" fill="#e6edf5" stroke="#293d56" stroke-opacity="0.12" stroke-width="1" /><text x="592" y="278" font-size="18" font-weight="400" fill="#293d56"><tspan x="592" dy="0">Assinar JWT HS256: sub, exp, jti único;</tspan><tspan x="592" dy="25.2">validade ≤ 600 s</tspan></text><path d="M821 353v22m-5-5 5 5 5-5" stroke="#60706b" stroke-width="1.5" fill="none" /><rect x="574" y="376" width="494" height="106" rx="12" fill="#e0efe8" stroke="#1e4436" stroke-opacity="0.12" stroke-width="1" /><text x="592" y="408" font-size="18" font-weight="400" fill="#293d56"><tspan x="592" dy="0">Redirecionar navegador a</tspan><tspan x="592" dy="25.2">/f/&lt;board-token&gt;?sso=&lt;jwt&gt;</tspan></text><path d="M821 483v22m-5-5 5 5 5-5" stroke="#60706b" stroke-width="1.5" fill="none" /><rect x="574" y="506" width="494" height="106" rx="12" fill="#f0ecf6" stroke="#433352" stroke-opacity="0.12" stroke-width="1" /><text x="592" y="538" font-size="18" font-weight="400" fill="#293d56"><tspan x="592" dy="0">Token de uso único cria sessão; abrir Meus</tspan><tspan x="592" dy="25.2">comentários</tspan></text><text x="32" y="688" font-size="17" font-weight="400" fill="#293d56"><tspan x="32" dy="0">Nunca enviar chave de ingestão ou segredo SSO ao navegador. Tolerância de relógio: 60 s.</tspan></text></g></svg>
