title = "Minddy public-repository secret and data-marker policy"

[extend]
useDefault = true

# Provider tokens, private keys, and generic high-entropy credentials are
# inherited from Gitleaks' maintained default rules. These local rules cover
# publication-specific data markers that do not have stable provider prefixes.

[[rules]]
id = "minddy-internal-network-url"
description = "Potential internal network URL exposed in public content."
regex = '''(?i)\bhttps?://((?:10\.(?:\d{1,3}\.){2}\d{1,3}|192\.168\.(?:\d{1,3}\.)\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.(?:\d{1,3}\.)?\d{1,3}|[a-z0-9-]+\.(?:internal|corp|local))(?::\d{1,5})?(?:[/?#][^\s"']*)?)'''
secretGroup = 1
keywords = ["http://", "https://"]

[[rules]]
id = "minddy-personal-email-marker"
description = "Potential personal email address exposed in public content."
regex = '''\b([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})\b'''
secretGroup = 1

[[rules.allowlists]]
description = "Synthetic or project-owned public contact domains."
stopwords = ["example.com", "example.test", "minddy.app", "users.noreply.github.com"]
