name: minddy-managed

services:
  minddy:
    image: ${MINDDY_IMAGE:?Set MINDDY_IMAGE from the matching compatibility row.}
    restart: unless-stopped
    env_file:
      - ${MINDDY_ENV_FILE:?Set MINDDY_ENV_FILE to the protected deployment environment file.}
    expose:
      - "3000"
    depends_on:
      agent-runner:
        condition: service_healthy
    networks:
      - private
      - agent_egress
    labels:
      org.opencontainers.image.version: ${MINDDY_RELEASE:?Set MINDDY_RELEASE from the matching compatibility row.}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE from the matching compatibility row.}
    restart: unless-stopped
    depends_on:
      minddy:
        condition: service_healthy
    ports:
      - ${MINDDY_HTTP_BIND_ADDRESS:-0.0.0.0}:80:80
      - ${MINDDY_HTTP_BIND_ADDRESS:-0.0.0.0}:443:443
    environment:
      MINDDY_HOST: ${MINDDY_HOST:?Set MINDDY_HOST to the public hostname.}
      MINDDY_SITE_ADDRESS: ${MINDDY_SITE_ADDRESS:-${MINDDY_HOST}}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL for certificate notices.}
    volumes:
      - ${MINDDY_DEPLOY_DIR:?Set MINDDY_DEPLOY_DIR to this release directory.}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - private
    healthcheck:
      test: ["CMD", "caddy", "adapt", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    image: ${SCHEDULER_IMAGE:?Set SCHEDULER_IMAGE from the matching compatibility row.}
    restart: unless-stopped
    depends_on:
      minddy:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET before enabling scheduled jobs.}
      MINDDY_SCHEDULER_URL: ${MINDDY_SCHEDULER_URL:-http://minddy:3000}
    command: ["node", "/scheduler/scheduler.mjs"]
    volumes:
      - ${MINDDY_DEPLOY_DIR:?Set MINDDY_DEPLOY_DIR to this release directory.}/scheduler.mjs:/scheduler/scheduler.mjs:ro
    networks:
      - private
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3

  agent-runner:
    image: ${MINDDY_IMAGE:?Set MINDDY_IMAGE from the matching compatibility row.}
    restart: unless-stopped
    user: "0:0"
    read_only: true
    command: ["node", "/app/agent-runner.mjs"]
    environment:
      AGENT_RUNNER_SECRET: ${AGENT_RUNNER_SECRET:?Set AGENT_RUNNER_SECRET.}
      AGENT_RUNNER_SANDBOX_IMAGE: ${MINDDY_IMAGE:?Set MINDDY_IMAGE.}
      AGENT_RUNNER_NETWORK: minddy-managed_agent_egress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - private
      - agent_egress
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6464/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
  private:
    internal: true
  agent_egress:
