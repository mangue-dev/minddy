name: minddy-full

services:
  # Compile the unchanged upstream entrypoint before Compose starts. Its locked
  # dependencies are inside the eszip, so startup needs no registry connection.
  functions:
    command: ["start", "--main-service", "/opt/minddy-functions/main.eszip"]
    volumes:
      - ${MINDDY_ENV_FILE:?Set MINDDY_ENV_FILE to the protected deployment environment file.}.functions:/opt/minddy-functions:ro

  # The upstream distribution remains the first Compose file. This overlay adds
  # minddy services and removes all upstream host port publications.
  kong:
    ports: !reset []

  supavisor:
    ports: !reset []

  db:
    ports: !reset []

  database-access:
    image: ${SCHEDULER_IMAGE:?Set SCHEDULER_IMAGE from the matching compatibility row.}
    restart: unless-stopped
    read_only: true
    user: "node"
    command: ["node", "/maintenance/database-proxy.mjs"]
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 127.0.0.1:${MINDDY_POSTGRES_BIND_PORT:-54322}:5432
      - 127.0.0.1:${MINDDY_SUPABASE_MAINTENANCE_PORT:-8001}:8000
    volumes:
      - ${MINDDY_DEPLOY_DIR:?Set MINDDY_DEPLOY_DIR to this release directory.}/database-proxy.mjs:/maintenance/database-proxy.mjs:ro
    networks:
      - default
      - maintenance
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('node:net');const s=net.connect(5432,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));s.setTimeout(3000,()=>process.exit(1));"]
      interval: 5s
      timeout: 5s
      retries: 3

  auth:
    environment:
      GOTRUE_PASSWORD_MIN_LENGTH: "8"
      GOTRUE_PASSWORD_REQUIRED_CHARACTERS: "abcdefghijklmnopqrstuvwxyz:ABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789"
      GOTRUE_PASSWORD_HIBP_ENABLED: "true"
      GOTRUE_PASSWORD_HIBP_FAIL_CLOSED: "true"
      GOTRUE_SESSIONS_TIMEBOX: "720h"
      GOTRUE_SESSIONS_INACTIVITY_TIMEOUT: "168h"
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: '{{ if eq (printf "%v" (index .Data "locale")) "fr" }}Confirmez votre adresse e-mail{{ else }}Confirm your email{{ end }}'
      GOTRUE_MAILER_SUBJECTS_RECOVERY: '{{ if eq (printf "%v" (index .Data "locale")) "fr" }}Réinitialisez votre mot de passe{{ else }}Reset your password{{ end }}'
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://minddy:3000/api/self-hosting/email-templates/confirm-signup
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://minddy:3000/api/self-hosting/email-templates/reset-password
    networks:
      - default
      - auth_egress

  minddy:
    image: ${MINDDY_IMAGE:?Set MINDDY_IMAGE from the matching compatibility row.}
    restart: unless-stopped
    env_file:
      - ${MINDDY_ENV_FILE:?Set MINDDY_ENV_FILE to the protected deployment environment file.}
    environment:
      SUPABASE_INTERNAL_URL: http://kong:8000
    expose:
      - "3000"
    depends_on:
      kong:
        condition: service_healthy
      agent-runner:
        condition: service_healthy
    networks:
      - default
      - private
      - agent_egress
    labels:
      org.opencontainers.image.version: ${MINDDY_RELEASE:?Set MINDDY_RELEASE from the matching compatibility row.}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE from the matching compatibility row.}
    restart: unless-stopped
    depends_on:
      minddy:
        condition: service_healthy
      kong:
        condition: service_healthy
    ports:
      - ${MINDDY_HTTP_BIND_ADDRESS:-0.0.0.0}:80:80
      - ${MINDDY_HTTP_BIND_ADDRESS:-0.0.0.0}:443:443
      - ${MINDDY_SUPABASE_HTTP_BIND_ADDRESS:-127.0.0.1}:${MINDDY_SUPABASE_HTTP_PORT:-8000}:8000
    environment:
      MINDDY_HOST: ${MINDDY_HOST:?Set MINDDY_HOST to the selected app host.}
      MINDDY_SITE_ADDRESS: ${MINDDY_SITE_ADDRESS:-${MINDDY_HOST}}
      SUPABASE_HOST: ${SUPABASE_HOST:?Set SUPABASE_HOST to the selected Supabase API host.}
      SUPABASE_SITE_ADDRESS: ${SUPABASE_SITE_ADDRESS:-${SUPABASE_HOST}}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL for certificate notices.}
    volumes:
      - ${MINDDY_DEPLOY_DIR:?Set MINDDY_DEPLOY_DIR to this release directory.}/Caddyfile.full:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - edge
      - private
    healthcheck:
      test: ["CMD", "caddy", "adapt", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    image: ${SCHEDULER_IMAGE:?Set SCHEDULER_IMAGE from the matching compatibility row.}
    restart: unless-stopped
    depends_on:
      minddy:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET before enabling scheduled jobs.}
      MINDDY_SCHEDULER_URL: ${MINDDY_SCHEDULER_URL:-http://minddy:3000}
    command: ["node", "/scheduler/scheduler.mjs"]
    volumes:
      - ${MINDDY_DEPLOY_DIR:?Set MINDDY_DEPLOY_DIR to this release directory.}/scheduler.mjs:/scheduler/scheduler.mjs:ro
    networks:
      - private
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3

  agent-runner:
    image: ${MINDDY_IMAGE:?Set MINDDY_IMAGE from the matching compatibility row.}
    restart: unless-stopped
    user: "0:0"
    read_only: true
    command: ["node", "/app/agent-runner.mjs"]
    environment:
      AGENT_RUNNER_SECRET: ${AGENT_RUNNER_SECRET:?Set AGENT_RUNNER_SECRET.}
      AGENT_RUNNER_SANDBOX_IMAGE: ${MINDDY_IMAGE:?Set MINDDY_IMAGE.}
      AGENT_RUNNER_NETWORK: minddy-full_agent_egress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - private
      - agent_egress
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6464/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:

networks:
  # Supabase services use an internal network. Caddy alone joins `edge` for
  # ingress and ACME. Auth uses `auth_egress` for SMTP and password-compromise
  # checks. The application, runner, and sandboxes use `agent_egress` for
  # operator-selected providers. Sandboxes do not join the Supabase network.
  default:
    internal: true
  edge:
  auth_egress:
  # Port publishing requires a non-internal attachment. Only the loopback
  # database proxy joins this network; PostgreSQL itself remains internal.
  maintenance:
  private:
    internal: true
  agent_egress:
